---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before adopting a new release. A compromised release is usually caught and
    # yanked within days; adopting it the hour it appears is how that reaches you.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    # One pull request for the routine bumps rather than one per action: every pull
    # request here runs the whole of `ci` and `security`, so three separate patch
    # bumps cost three full matrices. Majors stay out of the group and arrive on their
    # own, because a grouped major is a breaking change hidden among patches. Two
    # edits would quietly break that. Adding `group-by` is the first: reading
    # dependabot-core, a dependency the semver rule rejects is only marked handled when
    # a group sets that key, so majors would be dropped rather than raised separately.
    # The documented schema describes the key without mentioning that interaction, so
    # re-read the source before adding it rather than trusting either. The second is
    # pinning an action to a SHA carrying no upstream tag, which the semver rule cannot
    # classify, so it falls out onto individual pull requests.
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  # The hashed requirements under .github/requirements/ are regenerated, never edited:
  # the two scanner files from upstream lock files, site-browser.txt as a whole with its
  # digests, each as its own header describes. A bump edited into one line breaks the
  # --require-hashes install whenever the new version needs a dependency the file does
  # not carry, and the next regeneration reverts it anyway. Ignoring every dependency is
  # what stops both version and security update pull requests here;
  # `open-pull-requests-limit: 0` alone would still let security updates through. An
  # advisory against one of these packages still raises an alert in the Security tab,
  # and is cleared by regenerating the file as its header shows, with an
  # --upgrade-package pin for a scanner file, not by bumping the line.
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    ignore:
      - dependency-name: '*'
