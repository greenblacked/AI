---
# Trigger evaluation. Three jobs: the whole catalogue monthly or on request, the skills
# and agents a pull request changed plus their declared neighbours, and a
# quality benchmark of the `reviewer` subagent — monthly, on request, or on a pull
# request that changes the benchmark itself. None is a required check, and the pull
# request one fails only below a floor well
# under its reporting bar: scoring costs money, it is sampled rather than deterministic,
# and a gate that is occasionally wrong is a gate people learn to override. The schema of
# every eval set is checked on every push by `skillcheck`; this workflow scores the
# queries.
name: Trigger evals

on:
  # Monthly, and not a gate. Scoring costs money and is sampled, which is why nothing
  # depends on it — but until this existed it had no cadence at all, so a skill that
  # scored 100% could be starved by a sibling added later and nothing would ever
  # re-measure it. Every query is judged against the whole catalogue, so the right
  # answer changes when the catalogue does.
  schedule:
    - cron: '0 7 1 * *'
  # On every pull request, for changed skills and agents plus their neighbours.
  # A monthly cadence does not tell the author of a new skill that it took a neighbour's
  # queries, and that collision is invisible in the new skill's own score — one merged
  # at 95% while breaking the skill next door. Deliberately no `paths:` filter, for the
  # reason ci.yml gives: a workflow skipped by a path filter leaves its check Pending
  # forever. The job runs every time and reports that nothing changed when nothing did.
  pull_request:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill directory or subagent .md file to score, or "all"'
        required: true
        default: all
        type: string
      budget:
        description: >-
          Listing budget in characters, to score descriptions the way the runtime
          shows them; blank scores them at full length
        required: false
        default: ''
        type: string
      runs:
        description: Samples per query; unique highest count wins, top ties are inconclusive
        required: false
        default: '3'
        type: string
      threshold:
        description: Minimum pass rate before the run is considered a failure
        required: false
        default: '0.8'
        type: string
      backend:
        description: >-
          Which model CLI answers. The credential is the one that CLI reads:
          CLAUDE_CODE_OAUTH_TOKEN (a subscription login) or ANTHROPIC_API_KEY for
          claude, OPENAI_API_KEY for codex, GEMINI_API_KEY for gemini
        required: false
        default: claude
        type: choice
        options:
          - claude
          - codex
          - gemini
      model:
        description: Model name passed to the CLI; blank uses the CLI's default
        required: false
        default: ''
        type: string
      reviewer:
        description: >-
          Also run the reviewer quality benchmark (the `reviewer-benchmark` job);
          off by default because it costs a full review run per case
        required: false
        default: false
        type: boolean

permissions: {}

# Pull requests supersede each other; scheduled and dispatched runs do not. A shared
# group keyed on the ref would let someone dispatching a run cancel the monthly one,
# since both are on main and the monthly run takes two hours.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.run_id }}
  cancel-in-progress: true

# The backend CLIs, pinned at workflow level the way ci.yml and security.yml pin theirs.
# They were set twice in step-level blocks, and `CLAUDE_CODE_VERSION` had to agree with
# the copy in ci.yml as well — three places, none of them aware of the others. Bumping
# one and not the rest would have the harness score descriptions against a different CLI
# than `validate-plugin` validated the manifest with, and that surfaces as a moved score
# rather than as an error. `scripts/check_workflows.py` now fails when the name means two
# things; keeping one copy per workflow is what makes that check easy to satisfy.
env:
  CLAUDE_CODE_VERSION: '2.1.287'
  CODEX_VERSION: '0.160.0'
  GEMINI_CLI_VERSION: '0.62.0'
  PYTEST_VERSION: '9.1.1'
  COVERAGE_VERSION: '7.16.2'

jobs:
  evaluate:
    name: score descriptions
    # The whole catalogue, monthly or on request. A pull request scores only what it
    # touched, in `evaluate-changed` below; running this one per push would be three
    # thousand model calls a commit.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # At the defaults this is fifty targets x twenty queries x three samples, three
    # thousand model calls with four in flight at a time. The runner writes its results
    # file after each target, so a timeout still leaves the scores already paid for on
    # disk rather than discarding all of them.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Check the chosen backend has a credential
        id: credentials
        # The harness reads no key of its own; each CLI reads the credential it
        # expects. Failing here with a sentence beats failing forty model calls later
        # with a stack trace. A subscription login is the intended default for claude:
        # `claude setup-token` on a workstation prints the OAuth token to store.
        run: |
          set -Eeuo pipefail
          case "$BACKEND" in
            claude)
              present="${CLAUDE_CODE_OAUTH_TOKEN:-}${ANTHROPIC_API_KEY:-}"
              wanted="CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY"
              ;;
            codex)
              present="${OPENAI_API_KEY:-}"
              wanted="OPENAI_API_KEY"
              ;;
            gemini)
              present="${GEMINI_API_KEY:-}"
              wanted="GEMINI_API_KEY"
              ;;
            *)
              echo "::error title=unknown backend::$BACKEND"
              exit 1
              ;;
          esac
          if [ -z "$present" ]; then
            # A monthly run that fails for want of a secret nobody set is a red mark
            # people learn to ignore, and this workflow gates nothing. So the scheduled
            # run stands down with a notice, and a run somebody asked for fails loudly
            # with the same sentence — they are owed the error. A pull request stands
            # down for a second reason: one from a fork is handed no secrets at all, and
            # a contributor must never face a red check they have no way to make green.
            case "${GITHUB_EVENT_NAME}" in
              schedule | pull_request)
                echo "::notice title=no credentials::Skipping the trigger eval:" \
                  "set the $wanted repository secret to enable it"
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
            echo "::error title=no credentials::Set the $wanted repository secret" \
              "to run trigger evals with the $BACKEND backend"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
        env:
          BACKEND: ${{ inputs.backend || 'claude' }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Score the eval sets
        if: steps.credentials.outputs.skip != 'true'
        run: |
          set -Eeuo pipefail
          case "$BACKEND" in
            claude) npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" ;;
            codex)
              npm install --global "@openai/codex@${CODEX_VERSION}"
              # codex takes its key through a login rather than from the environment.
              printenv OPENAI_API_KEY | codex login --with-api-key
              ;;
            gemini) npm install --global "@google/gemini-cli@${GEMINI_CLI_VERSION}" ;;
          esac
          if [ "$SKILL" = "all" ]; then
            target=(--all)
          elif [[ "$SKILL" == *.md ]]; then
            target=(--agent "$SKILL")
          else
            target=(--skill "$SKILL")
          fi
          extra=(--backend "$BACKEND")
          if [ -n "$BUDGET" ]; then
            extra+=(--budget "$BUDGET")
          fi
          if [ -n "$MODEL" ]; then
            extra+=(--model "$MODEL")
          fi
          python scripts/run_trigger_eval.py "${target[@]}" "${extra[@]}" \
            --runs "$RUNS" --threshold "$THRESHOLD" --jobs 4 --json evals.json --verbose
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BACKEND: ${{ inputs.backend || 'claude' }}
          MODEL: ${{ inputs.model }}
          SKILL: ${{ inputs.skill || 'all' }}
          BUDGET: ${{ inputs.budget }}
          RUNS: ${{ inputs.runs || '3' }}
          THRESHOLD: ${{ inputs.threshold || '0.8' }}
      - name: Publish the scores
        if: always() && steps.credentials.outputs.skip != 'true'
        run: |
          set -Eeuo pipefail
          [ -f evals.json ] || exit 0
          {
            echo "### Trigger evaluation"
            echo ""
            echo "| Target | Pass rate | Recall | Specificity | Routing | Narrow | Inconclusive |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
            python -c "
          import json
          for r in json.load(open('evals.json')):
              routing = '-' if r.get('routing') is None else f\"{r['routing']:.0%}\"
              name = r.get('target', r.get('skill'))
              cells = [name, f\"{r['rate']:.0%}\", f\"{r['recall']:.0%}\",
                       f\"{r['specificity']:.0%}\", routing, str(r.get('narrow', 0)), str(r.get('inconclusive', '-'))]
              print('| \`' + cells[0] + '\` | ' + ' | '.join(cells[1:]) + ' |')
          "
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && steps.credentials.outputs.skip != 'true'
        with:
          name: trigger-evals
          path: evals.json
          if-no-files-found: ignore

  evaluate-changed:
    name: score changed skills
    # Only a pull request has a base to diff against. A job skipped by an `if:` reports
    # success, which is the mechanism ci.yml documents as the safe one — unlike a
    # workflow-level `paths:` filter, which leaves the check Pending and blocks a merge.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Twelve targets at twenty queries and three samples is seven hundred calls with
    # four in flight, well inside this. The monthly job's two hours is for fifty.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The base branch has to be reachable for the diff below; the default shallow
          # clone has only the pull request's own commits.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Work out which targets the pull request touches
        id: targets
        # Plain git rather than a changed-files action: this is one diff, and an action
        # would be another pinned dependency in the supply chain for it.
        run: |
          set -Eeuo pipefail
          if ! git rev-parse --verify --quiet "origin/${GITHUB_BASE_REF}" > /dev/null; then
            git fetch --no-tags --prune --quiet origin \
              "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          fi
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > changed-paths.txt
          python - <<'EOF'
          import json
          import os
          import pathlib

          # Past a dozen targets the run stops being a pull request check and starts
          # being the monthly job, so it truncates and says that it did.
          CAP = 12

          root = pathlib.Path(".")
          changed = [
              line.strip()
              for line in pathlib.Path("changed-paths.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]


          def target_of(path):
              """A changed skill, agent definition, or paired agent eval set."""
              parts = pathlib.PurePosixPath(path).parts
              if len(parts) >= 4 and parts[0] == "plugins" and parts[2] == "skills":
                  return ("skill", pathlib.Path(*parts[:4]))
              if len(parts) >= 3 and parts[:2] == (".claude", "agents"):
                  parent, tail = pathlib.Path(*parts[:2]), parts[2:]
              elif len(parts) >= 4 and parts[0] == "plugins" and parts[2] == "agents":
                  parent, tail = pathlib.Path(*parts[:3]), parts[3:]
              else:
                  return None
              if len(tail) == 1 and tail[0].endswith(".md"):
                  return ("agent", parent / tail[0])
              if len(tail) == 2 and tail[0] == "evals" and tail[1].endswith(".json"):
                  return ("agent", parent / (pathlib.Path(tail[1]).stem + ".md"))
              return None


          def definition(target):
              kind, path = target
              return path / "SKILL.md" if kind == "skill" else path


          def eval_set(target):
              kind, path = target
              if kind == "skill":
                  return path / "evals" / "trigger-eval.json"
              return path.parent / "evals" / (path.stem + ".json")


          def resolve(name):
              """A name in an `expected` field, as a scorable target.

              Both places a subagent legitimately lives are searched, because a skill's
              near-miss queries are routinely owned by one.
              """
              for candidate in sorted(root.glob(f"plugins/*/skills/{name}")):
                  target = ("skill", candidate)
                  if definition(target).is_file() and eval_set(target).is_file():
                      return target
              for parent in ("plugins/*/agents", ".claude/agents"):
                  for candidate in sorted(root.glob(f"{parent}/{name}.md")):
                      if (candidate.parent / "evals" / f"{name}.json").is_file():
                          return ("agent", candidate)
              return None


          touched, unscorable = [], []
          for path in changed:
              target = target_of(path)
              if target is None or target in touched or target in unscorable:
                  continue
              # Deleted definitions and orphaned eval sets cannot be passed to the harness.
              if not definition(target).is_file():
                  continue
              if eval_set(target).is_file():
                  touched.append(target)
              else:
                  unscorable.append(target)

          # The declared neighbours: targets that changed targets' negatives say should
          # win them. Scoring only the changed target cannot see a routing collision.
          neighbours = []
          for target in touched:
              queries = json.loads(eval_set(target).read_text(encoding="utf-8"))
              kind, path = target
              own_name = path.name if kind == "skill" else path.stem
              for query in queries:
                  name = query.get("expected")
                  if not name or name == own_name:
                      continue
                  neighbour = resolve(name)
                  if neighbour is None or neighbour in touched or neighbour in neighbours:
                      continue
                  neighbours.append(neighbour)

          selected = touched + neighbours
          truncated = max(0, len(selected) - CAP)
          selected = selected[:CAP]

          pathlib.Path("targets.txt").write_text(
              "".join(f"{kind} {path.as_posix()}\n" for kind, path in selected), encoding="utf-8"
          )

          notes = ["### Trigger evals for changed skills and agents", ""]
          if not selected:
              notes.append(
                  "No skill or agent in this pull request has a trigger eval set to score. "
                  "Nothing to do, and nothing is wrong."
              )
          else:
              notes.append(
                  f"Scoring {sum(target in touched for target in selected)} changed target(s) and "
                  f"{sum(target in neighbours for target in selected)} declared neighbour(s)."
              )
          if unscorable:
              notes.append("")
              notes.append(
                  "Not scored, no eval set: "
                  + ", ".join(f"`{path.as_posix()}`" for _, path in unscorable)
                  + "."
              )
          if truncated:
              notes.append("")
              notes.append(
                  f"Truncated at {CAP} targets; {truncated} more were dropped. "
                  "Run the monthly job by hand if the rest matter."
              )
          notes.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(notes) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"count={len(selected)}\n")
          for kind, path in selected:
              print(f"{kind} {path.as_posix()}")
          EOF
      - name: Check the backend has a credential
        id: credentials
        if: steps.targets.outputs.count != '0'
        # A pull request from a fork is handed no secrets, so a missing credential
        # there cannot be an error: the contributor could do nothing about it, and a red
        # check nobody can make green is a check everybody learns to ignore. A pull
        # request from this same repository is a different case — the maintainer could
        # set the secret and has not, so a notice claiming "expected on a fork" would be
        # false for them, and it is how the 0.7 floor below went unenforced with nothing
        # saying so. SAME_REPO is computed in `env`, never interpolated into the script
        # itself, so the head repo's name never reaches the shell as literal text.
        # A same-repository pull request opened by Dependabot is a third shape: GitHub
        # withholds repository secrets from those too, so this warning can still fire
        # there even with CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY configured — that
        # is expected, not a sign the secret is missing or misnamed.
        run: |
          set -Eeuo pipefail
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}${ANTHROPIC_API_KEY:-}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"
          if [ "$SAME_REPO" = "true" ]; then
            echo "::warning title=no credential configured::Trigger-eval scoring is" \
              "inactive: set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as a" \
              "repository secret to enforce the 0.7 floor on pull requests"
            {
              echo "Not scored: no model credential is configured as a repository"
              echo "secret. Scoring is inactive until CLAUDE_CODE_OAUTH_TOKEN or"
              echo "ANTHROPIC_API_KEY is set."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=no credentials::Not scoring the changed skills and agents:" \
              "this run has no CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY," \
              "which is expected on a pull request from a fork"
            {
              echo "Not scored: this run has no model credential. That is expected on a"
              echo "pull request from a fork, and is not a failure."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.targets.outputs.count != '0' && steps.credentials.outputs.skip != 'true'
        with:
          node-version: '22'
      - name: Score each target
        id: score
        if: steps.targets.outputs.count != '0' && steps.credentials.outputs.skip != 'true'
        # One invocation per target, because the harness takes exactly one target and
        # rewrites `--json` wholesale: a second run into the same file would erase the
        # first. The publish step merges the files back into one table.
        run: |
          set -Eeuo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          mkdir -p eval-results
          index=0
          while read -r kind path <&3; do
            index=$((index + 1))
            case "$kind" in
              skill) flag=--skill ;;
              agent) flag=--agent ;;
              *) echo "::error title=unknown target kind::$kind"; exit 1 ;;
            esac
            code=0
            python scripts/run_trigger_eval.py "$flag" "$path" \
              --runs 3 --threshold "$REPORT_BAR" --jobs 4 --verbose \
              --json "eval-results/$(printf '%03d' "$index").json" || code=$?
            # 1 is "scored below the reporting bar", which the publish step judges
            # against the floor. Anything higher is the harness itself failing — an
            # unreachable model, a malformed eval set — and has no score to report.
            if [ "$code" -ge 2 ]; then
              echo "::error title=eval harness failed::$path exited $code"
              exit "$code"
            fi
          done 3< targets.txt
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_BAR: '0.8'
      - name: Publish the scores
        # `!= 'skipped'` rather than `== 'success'`: when the harness itself dies
        # partway through, the scores already paid for are still worth showing.
        if: always() && steps.score.outcome != 'skipped'
        # Advisory above the floor, and the gap between the two numbers is the point.
        # Measured variance here is about five points — one skill read 85% and 90% on
        # the same tree — so failing at the 0.8 reporting bar would fail on noise, and a
        # gate that fails on noise is one people learn to override. 0.7 is below the
        # noise and still well above a description that has stopped working.
        run: |
          set -Eeuo pipefail
          python - <<'EOF'
          import json
          import os
          import pathlib

          FLOOR = 0.7
          BAR = 0.8

          rows = []
          for path in sorted(pathlib.Path("eval-results").glob("*.json")):
              rows.extend(json.loads(path.read_text(encoding="utf-8")))

          lines = [
              "| Target | Pass rate | Recall | Specificity | Routing | Narrow | Inconclusive |",
              "| --- | --- | --- | --- | --- | --- | --- |",
          ]
          for row in rows:
              routing = "-" if row.get("routing") is None else f"{row['routing']:.0%}"
              name = row.get("target", row.get("skill"))
              cells = [
                  f"`{name}`",
                  f"{row['rate']:.0%}",
                  f"{row['recall']:.0%}",
                  f"{row['specificity']:.0%}",
                  routing,
                  str(row.get("narrow", 0)),
                  str(row.get("inconclusive", "-")),
              ]
              lines.append("| " + " | ".join(cells) + " |")

          under_floor = [r for r in rows if r["rate"] < FLOOR]
          advisory = [r for r in rows if FLOOR <= r["rate"] < BAR]
          lines.append("")
          if under_floor:
              lines.append(
                  "Below the "
                  f"{FLOOR:.0%} floor: "
                  + ", ".join(f"`{r['target']}`" for r in under_floor)
                  + ". This fails the job."
              )
          if advisory:
              lines.append("")
              lines.append(
                  f"Between {FLOOR:.0%} and the {BAR:.0%} reporting bar: "
                  + ", ".join(f"`{r['target']}`" for r in advisory)
                  + ". Advisory — run-to-run variance here is about five points."
              )
          if not rows:
              lines.append("No results were written.")
          lines.append("")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")

          for row in advisory:
              print(f"::notice title=below the reporting bar::{row['target']} scored {row['rate']:.0%}")
          for row in under_floor:
              print(f"::error title=below the eval floor::{row['target']} scored {row['rate']:.0%}")
          raise SystemExit(1 if under_floor else 0)
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        # `!= 'skipped'` rather than `== 'success'`: when the harness itself dies
        # partway through, the scores already paid for are still worth showing.
        if: always() && steps.score.outcome != 'skipped'
        with:
          name: trigger-evals-changed
          path: eval-results
          if-no-files-found: ignore

  reviewer-benchmark:
    name: benchmark the reviewer
    # The trigger eval asks whether `reviewer` gets chosen; this asks whether what comes
    # back is any good — whether a seeded defect from docs/review-lessons.md is caught,
    # and whether an honest clean change is shipped rather than stalled on an invented
    # objection. It runs the real subagent through the real CLI, so it costs a model call
    # per case per sample. On a pull request it therefore runs only when the thing it
    # measures changed: the cases, the agent, or the harness. A scheduled or dispatched
    # run always goes. The job carries no job-level `if:`, because one that skips reports
    # success but a pull request that touches none of those inputs should still get a
    # green check rather than a Pending one; the gate step below decides instead.
    runs-on: ubuntu-latest
    # Twenty-seven cases, three samples each, four in flight — every sample a full review
    # run with up to forty turns. Two hours covers that with headroom, and each sample is
    # also bounded by the harness's own per-run timeout.
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The base branch has to be reachable for the diff the gate step runs.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Decide whether the benchmark measures this change
        id: gate
        run: |
          set -Eeuo pipefail
          case "${GITHUB_EVENT_NAME}" in
            schedule)
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            workflow_dispatch)
              # A dispatch is usually a person re-scoring one skill; the benchmark costs a
              # full review run per case, so it only goes when the `reviewer` input asks.
              if [ "${REVIEWER_INPUT}" = "true" ]; then
                echo "run=true" >> "$GITHUB_OUTPUT"
              else
                echo "run=false" >> "$GITHUB_OUTPUT"
              fi
              exit 0
              ;;
          esac
          # A pull request: run only when it changes one of the three things a benchmark
          # number depends on — the cases, the agent under test, or the harness.
          if ! git rev-parse --verify --quiet "origin/${GITHUB_BASE_REF}" > /dev/null; then
            git fetch --no-tags --prune --quiet origin \
              "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          fi
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > changed-paths.txt
          measured='^(\.claude/agents/benchmarks/|\.claude/agents/reviewer\.md$|scripts/run_review_benchmark\.py$)'
          if grep -Eq "$measured" changed-paths.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Reviewer benchmark"
              echo ""
              echo "Not run: this pull request changes nothing the benchmark measures."
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          REVIEWER_INPUT: ${{ inputs.reviewer }}
      - name: Check the benchmark has a credential
        id: credentials
        if: steps.gate.outputs.run == 'true'
        # Same split as `evaluate`: a scheduled run with no secret stands down with a
        # notice, because a red mark nobody can clear is one people learn to ignore, and
        # a pull request from a fork is handed no secrets at all. A run somebody asked
        # for is owed the error and fails loudly.
        run: |
          set -Eeuo pipefail
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}${ANTHROPIC_API_KEY:-}" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=true" >> "$GITHUB_OUTPUT"
          case "${GITHUB_EVENT_NAME}" in
            schedule | pull_request)
              echo "::notice title=no credentials::Skipping the reviewer benchmark:" \
                "set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY to enable it"
              ;;
            *)
              echo "::error title=no credentials::Set CLAUDE_CODE_OAUTH_TOKEN or" \
                "ANTHROPIC_API_KEY to run the reviewer benchmark"
              exit 1
              ;;
          esac
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        if: steps.gate.outputs.run == 'true' && steps.credentials.outputs.skip != 'true'
        with:
          node-version: '22'
      - name: Install the reviewer repository test dependencies
        if: steps.gate.outputs.run == 'true' && steps.credentials.outputs.skip != 'true'
        run: |
          set -Eeuo pipefail
          python -m pip install "pytest==${PYTEST_VERSION}" "coverage==${COVERAGE_VERSION}"
      - name: Benchmark the reviewer
        id: benchmark
        if: steps.gate.outputs.run == 'true' && steps.credentials.outputs.skip != 'true'
        # The harness exits 1 when a rate is below its threshold and 2 when it cannot run
        # at all; both leave the JSON on disk for the publish step, and the step's own
        # exit code is the signal either way.
        run: |
          set -Eeuo pipefail
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          python scripts/run_review_benchmark.py \
            --runs 3 --jobs 4 --json reviewer-benchmark.json
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Publish the benchmark
        if: always() && steps.gate.outputs.run == 'true' && steps.credentials.outputs.skip != 'true'
        run: |
          set -Eeuo pipefail
          [ -f reviewer-benchmark.json ] || exit 0
          python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          import pathlib

          rows = json.loads(pathlib.Path("reviewer-benchmark.json").read_text(encoding="utf-8"))
          lines = [
              "### Reviewer benchmark",
              "",
              "| Case | Kind | Verdict | Result | Cost |",
              "| --- | --- | --- | --- | --- |",
          ]
          for row in rows:
              verdict = row["verdict"] or "-"
              result = "pass" if row["passed"] else "FAIL"
              cost = f"${row['cost_usd']:.2f}" if row.get("cost_usd") else "-"
              lines.append(
                  f"| `{row['case']}` | {row['kind']} | {verdict} | {result} | {cost} |"
              )
          defects = [r for r in rows if r["kind"] == "defect"]
          clean = [r for r in rows if r["kind"] == "clean"]
          caught = sum(1 for r in defects if r["passed"])
          false_alarms = sum(1 for r in clean if not r["passed"])
          spent = sum(r.get("cost_usd") or 0 for r in rows)
          lines.append("")
          lines.append(
              f"catch rate: {caught}/{len(defects)}; "
              f"false alarms: {false_alarms}/{len(clean)}; total cost: ${spent:.2f}"
          )
          lines.append("")
          print("\n".join(lines))
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always() && steps.gate.outputs.run == 'true' && steps.credentials.outputs.skip != 'true'
        with:
          name: reviewer-benchmark
          path: reviewer-benchmark.json
          if-no-files-found: ignore
