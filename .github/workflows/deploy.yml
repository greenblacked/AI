---
# Checks the catalogue Cloudflare will serve, and previews it.
#
# A pull request builds the site and runs `wrangler deploy --dry-run`. That needs
# no credential, and this file's dry-run job never names one: a pull request,
# including one from a fork, cannot read the token by editing a step that already
# holds it, because no step here holds it.
#
# A push to the stage branch, or Run workflow from that branch, deploys the
# Worker greenblacked-ai-staging. Production is not this file. release.yml deploys
# greenblacked-ai after a vX.Y.Z tag has published its GitHub Release. The token
# for each lives on that GitHub environment, not in the repository. docs/ci.md
# records the permissions the token needs and the environment rules that keep a
# pull request from receiving it.
name: Deploy

on:
  pull_request:
  push:
    branches: [stage]
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_VERSION: '4.147.0'
  # wrangler 4 refuses to run below Node 22. Not a *_VERSION name: the weekly
  # freshness check compares those to the newest release, and the newest Node
  # is a different major from the one wrangler supports.
  WRANGLER_SEND_METRICS: 'false'

jobs:
  dry-run:
    name: dry-run deploy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Build the catalogue site
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          version="pr-${GIT_SHA:0:7}"
          PYTHONPATH=src python scripts/build_catalogue_site.py --version "$version"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.23.3'
          # The package-manager cache is a download Wrangler does not need, and
          # this job's node_modules has to be the lockfile's, not a cache entry.
          package-manager-cache: false
      - name: Check the Wrangler pin against the lockfile
        run: |
          set -Eeuo pipefail
          python scripts/check_wrangler_pin.py
      - name: Install Wrangler
        working-directory: deploy
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts
          installed=$(./node_modules/.bin/wrangler --version)
          if [ "$installed" != "$WRANGLER_VERSION" ]; then
            echo "::error::installed wrangler is ${installed}, pin is ${WRANGLER_VERSION}"
            exit 1
          fi
      - name: Check the Worker without deploying it
        working-directory: deploy
        # --no-autoconfig: wrangler 4 turns framework detection on by default and
        # will rewrite a project it does not recognise. --no-install-skills: the
        # same release can install agent skills into the checkout; the default is
        # off, and naming it keeps a later default from doing that in CI.
        run: |
          set -Eeuo pipefail
          ./node_modules/.bin/wrangler deploy --dry-run --config wrangler.json --env="" \
            --no-autoconfig --no-install-skills

  preview:
    name: preview
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: staging
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Staging deploys from the stage branch only
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -Eeuo pipefail
          if [ "$REF_TYPE" != branch ] || [ "$REF_NAME" != stage ]; then
            echo "::error::the staging Worker deploys from the stage branch only, not ${REF_TYPE} ${REF_NAME}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Build the catalogue site
        id: build
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          version="stage-${GIT_SHA:0:7}"
          PYTHONPATH=src python scripts/build_catalogue_site.py --version "$version" --noindex
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Check the Wrangler pin against the lockfile
        run: |
          set -Eeuo pipefail
          python scripts/check_wrangler_pin.py
      - name: Install Wrangler
        working-directory: deploy
        # No token in this step. --ignore-scripts so a dependency script does not
        # run in the job that is about to receive one.
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts
          installed=$(./node_modules/.bin/wrangler --version)
          if [ "$installed" != "$WRANGLER_VERSION" ]; then
            echo "::error::installed wrangler is ${installed}, pin is ${WRANGLER_VERSION}"
            exit 1
          fi
      - name: Deploy the staging Worker
        id: deploy
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          set -Eeuo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID on the staging environment (docs/ci.md)"
            exit 1
          fi
          ./node_modules/.bin/wrangler deploy --config wrangler.json --env staging \
            --no-autoconfig --no-install-skills \
            --message "stage ${GIT_SHA:0:7}" --tag "$GIT_SHA"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          python "$GITHUB_WORKSPACE/scripts/read_wrangler_deploy.py" \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the staging Worker
        id: smoke
        env:
          BUILT_URL: ${{ steps.deploy.outputs.url }}
          CONFIGURED_URL: ${{ vars.DEPLOY_URL }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -Eeuo pipefail
          if [ -z "$BUILT_URL" ]; then
            echo "::error::Wrangler did not report a workers.dev URL to smoke-test"
            exit 1
          fi
          staging_url=https://stage.ai.szolotov.com
          urls=("$BUILT_URL" "$staging_url")
          if [ -n "$CONFIGURED_URL" ] && [ "$CONFIGURED_URL" != "$BUILT_URL" ] && \
            [ "$CONFIGURED_URL" != "$staging_url" ]; then
            urls+=("$CONFIGURED_URL")
          fi
          for target in "${urls[@]}"; do
            scripts/smoke_site.sh "$target" "$VERSION" greenblacked-ai
          done
      - name: Roll back the staging Worker
        if: failure() && steps.deploy.outputs.deployed == 'true'
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          echo "::warning::the staging deploy did not pass; rolling it back"
          echo "::warning::production is a different Worker and is not touched"
          ./node_modules/.bin/wrangler rollback --config wrangler.json --env staging --yes \
            --message "Automatic rollback: failed smoke test in run ${GITHUB_RUN_ID}"
