---
# Opens the back-merge pull requests that follow a promotion, once the promotion has
# actually merged. Promotions here are squash merges, so each leaves the branch it came
# from without the commit that landed on the branch it went to; this keeps the three
# long-lived branches converging instead of drifting:
#
#   release/promote-dev-to-stage*   merged into stage  ->  stage into dev
#   release/promote-stage-to-main*  merged into main   ->  main into stage, main into dev
#
# The trigger is a `push` to `stage` or `main` and nothing else: no run on a pull request
# event of any kind, none on a tag, none on a manual dispatch. A push to a protected branch
# happens only when a pull request has merged into it, so "only after merge" is a property
# of the trigger, and the script then checks it rather than assuming it: it asks GitHub
# which pull request the pushed commit belongs to and acts only when that pull request is
# merged, was merged into the pushed branch, has a head in this repository named
# release/promote-dev-to-stage or release/promote-stage-to-main (for that base, followed by
# the end of the name, `-` or `/`), and has the pushed commit as its merge_commit_sha. A
# direct push, a push that no promotion produced, and the merge of a back-merge pull
# request itself, which would otherwise loop, all do nothing.
#
# A `push` run, unlike a `pull_request` run, has GITHUB_REF set to the branch itself, so
# the `back-merge` environment's deployment branch policy (stage and main) is evaluated
# against the branch and means something, and the checkout is the protected branch's tip,
# never a pull request's merge ref. `pull_request_target` is not used.
#
# Each back-merge is a pull request from a branch of its own, chore/back-merge-<source>-to-
# <destination>-<shortsha>, which the job creates with `POST git/refs` at the pushed commit.
# The job's GITHUB_TOKEN is read-only: the branch and the pull request are both made with the
# App's token. There is no commit, push or merge commit in CI; an existing ref is never
# moved, forced, reused or deleted, and dev, stage and main are never written. The job never
# merges, never enables auto-merge and never resolves a conflict; see scripts/back_merge.py
# and docs/ci.md#back-merges-after-a-promotion. A push to a chore/back-merge-* branch cannot
# start this workflow: the trigger is the two branches below and nothing else.
#
# Pull requests made with GITHUB_TOKEN start no workflow, so the required checks `ci` and
# `security` would never report on one. A token minted from a GitHub App does start them,
# and it is also what creates the branch, so the App is required: when its client id is not
# in the `back-merge` environment the job does nothing but print a notice saying so, and
# when it is configured but cannot mint a token (a wrong key, an App not installed here)
# the job fails. There is no fallback to GITHUB_TOKEN.
name: Back-merge

on:
  push:
    branches: [stage, main]

permissions: {}

# One run per branch at a time, never cancelled in flight: a run opens pull requests, and
# half a run is worse than a queued one.
concurrency:
  group: back-merge-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  back-merge:
    name: back-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main')
    # The `back-merge` environment holds the App's client id and private key and admits only
    # `stage` and `main`. GITHUB_REF is the pushed branch, so that policy admits exactly the
    # two branches this job runs for.
    environment: back-merge
    # The workflow token only checks out the branch. Everything that writes is done with the
    # App's token below, which is asked for contents and pull requests, write, and nothing else.
    permissions:
      contents: read  # the checkout
    env:
      # Whether the App is configured. `secrets` is not available to a step's `if:`, so the
      # test is made once here, as a string.
      APP_CONFIGURED: ${{ secrets.BACK_MERGE_APP_CLIENT_ID != '' }}
    steps:
      - name: Say that the App is not configured, and stop
        if: ${{ env.APP_CONFIGURED != 'true' }}
        run: |
          set -Eeuo pipefail
          message='The back-merge App is not configured, so no back-merge pull request was opened.'
          message+=' Create the App and add BACK_MERGE_APP_CLIENT_ID and BACK_MERGE_APP_PRIVATE_KEY'
          message+=' to the back-merge environment; see docs/ci.md#back-merges-after-a-promotion.'
          echo "::notice title=back-merge::${message}"
          echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ env.APP_CONFIGURED == 'true' }}
        with:
          # No `ref:`: on a push the default is the pushed commit on the protected branch,
          # so the script that runs is the one already reviewed there, never one from a
          # pull request's head.
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: ${{ env.APP_CONFIGURED == 'true' }}
        with:
          python-version: '3.13'
      - name: Mint an App token that creates the branch and opens the pull requests
        id: app
        # A client id that is set while the key is missing or wrong fails here, loudly.
        if: ${{ env.APP_CONFIGURED == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.BACK_MERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BACK_MERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open the back-merge pull requests for a merged promotion
        if: ${{ env.APP_CONFIGURED == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BACK_MERGE_TOKEN: app
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          python scripts/back_merge.py
