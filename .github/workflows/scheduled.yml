---
# Checks that depend on someone else's server staying up, kept out of the required
# gate. A gate that fails because a site was briefly down is a gate people learn to
# override. Spelling used to live here with only_warn set, which made it a gate nobody
# had to clear; it is a required check in ci.yml now.
name: Scheduled checks

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-links:
    name: external links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --cache --max-cache-age 1d --no-progress './**/*.md'
          fail: true
          jobSummary: true

  pin-freshness:
    name: pin freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Compare every pinned tool version against upstream
        # Dependabot updates `uses:` references and reusable workflows and never looks
        # inside an `env:` block, so nothing moves the version pins or the
        # markdownlint version the Makefile records. Without this they sit where they
        # are until somebody happens to wonder.
        #
        # It reports and does not bump. Adopting a version is the judgement the pinning
        # exists to preserve: a digest has to move with its version, and ruff 0.16
        # reformatting Markdown is why ruff is pinned at all.
        #
        # A pin behind upstream is a warning annotation and a green run, not a red one:
        # Claude Code and Codex publish nearly every week, and a run that is red nearly
        # every week is one nobody reads. It fails only for a pin the checker has no
        # upstream registered for, which is a defect here rather than news from upstream.
        run: |
          set -Eeuo pipefail
          python scripts/check_pin_freshness.py . | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          # Unauthenticated api.github.com allows sixty requests an hour per IP, which
          # a shared runner exhausts without this repository doing anything wrong.
          GH_TOKEN: ${{ github.token }}

  dependency-advisories:
    name: dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - name: Look the hashed requirement locks up in OSV
        # `.github/dependabot.yml` ignores `.github/requirements/`, because a version
        # edited into a hash-pinned lock breaks the install (#362), so nothing else
        # watches those locks for new advisories. This asks api.osv.dev about every
        # pinned package and version, markers included.
        #
        # A red run is the intended signal: regenerate the lock as its header describes,
        # or add a reviewed entry with a reason and an expiry to
        # `.github/requirements/advisories-accepted.json`. It fails closed, so an OSV
        # outage is a red run too rather than a silent pass; that is why it lives here
        # and not in ci.yml, where an outage would block merges.
        #
        # No token and no secret: the only outbound host is api.osv.dev.
        run: |
          set -Eeuo pipefail
          python scripts/check_lock_advisories.py . | tee -a "$GITHUB_STEP_SUMMARY"
