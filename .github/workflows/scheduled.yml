---
# Checks that depend on someone else's server staying up, kept out of the required
# gate. A gate that fails because a site was briefly down is a gate people learn to
# override. Spelling used to live here with only_warn set, which made it a gate nobody
# had to clear; it is a required check in ci.yml now.
name: Scheduled checks

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  external-links:
    name: external links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --cache --max-cache-age 1d --no-progress './**/*.md'
          fail: true
          jobSummary: true
