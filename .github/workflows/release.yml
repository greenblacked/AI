---
# Cuts a GitHub Release from a `vX.Y.Z` tag: notes from CHANGELOG.md, the .skill
# archives and the portable bundle attached. The cloudflare job then uploads that
# same catalogue to the production Worker. It runs only after the release job has
# succeeded, holds contents: read, and takes its Cloudflare token from the
# production environment. Cutting the tag itself is a maintainer step
# (`make release`, see scripts/release.py); this workflow only publishes what a
# tag that already exists on main describes.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The one job here that can write to the repository, and it is bounded three ways:
    # it only runs on a `vX.Y.Z` tag push, and it refuses a tagged commit that is not an
    # ancestor of `main` — see the step below and docs/ci.md's release section.
    permissions:
      contents: write  # spent on creating the release and uploading assets via gh, never on pushing code
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          # No `cache:` here on purpose. zizmor's cache-poisoning audit flags a
          # dependency cache on a tag-triggered workflow at high severity: restoring a
          # cache seeded by an earlier, less trusted run is a way to smuggle a modified
          # dependency into a job that is about to publish a release.

      - name: Verify the tagged commit is on main
        # A tag pushed at an unreviewed branch commit must not be able to publish. This
        # is the check that makes that true regardless of what the tag's message claims.
        run: |
          set -Eeuo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi

      - name: Validate every skill, subagent and the marketplace manifest
        # The same invocation ci.yml's validate-skills job runs. A tag is cut from a
        # commit that already passed this on its pull request, so this is a repeat
        # rather than new information — but a release published from a state this
        # workflow never itself checked is not a guarantee, it is a hope.
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python -m skillcheck . --strict

      - name: Write the release notes from CHANGELOG.md
        run: |
          set -Eeuo pipefail
          notes_file="$RUNNER_TEMP/notes.md"
          python scripts/release.py notes "$TAG" > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::error::release notes for $TAG are empty" >&2
            exit 1
          fi
          echo "NOTES_FILE=$notes_file" >> "$GITHUB_ENV"

      - name: Build a .skill archive for every skill
        # Exactly ci.yml's package job: build, then verify with the same script so the
        # two paths that ship an archive cannot drift against each other.
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/package_skills.py
      - name: Every archive holds a loadable skill
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/verify_archives.py .

      - name: Flatten every skill and zip the portable bundle
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/export_portable.py .
          (cd dist && python -m zipfile -c "portable-skills-$TAG.zip" portable)

      - name: Create or update the GitHub release
        # A re-run after a partial failure — the release created but an asset upload
        # failing partway through, say — has to be safe to repeat rather than erroring
        # on "release already exists" or leaving a stale asset from the failed attempt
        # behind. If the release already exists, this only replaces its assets, with
        # `--clobber` overwriting anything the earlier attempt managed to upload;
        # otherwise it creates the release fresh.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber \
              dist/*.skill "dist/portable-skills-$TAG.zip"
          else
            gh release create "$TAG" --verify-tag --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              dist/*.skill "dist/portable-skills-$TAG.zip"
          fi

  cloudflare:
    name: cloudflare
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    env:
      WRANGLER_VERSION: '4.147.0'
      WRANGLER_SEND_METRICS: 'false'
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the tagged commit is on main
        # Repeated from the release job. needs: means that job succeeded, and this
        # is the same check again so a later edit cannot drop it there and still
        # upload whatever the tag points at.
        run: |
          set -Eeuo pipefail
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$TAG points at $GITHUB_SHA, which is not on main" >&2
            exit 1
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          # No cache. The release job's comment is the reason: a tag-triggered
          # workflow must not restore a dependency cache another run wrote.
      - name: Build the catalogue site
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/build_catalogue_site.py --version "$TAG"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.23.3'
          package-manager-cache: false
      - name: Check the Wrangler pin against the lockfile
        run: |
          set -Eeuo pipefail
          python scripts/check_wrangler_pin.py
      - name: Install Wrangler
        working-directory: deploy
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts
          installed=$(./node_modules/.bin/wrangler --version)
          if [ "$installed" != "$WRANGLER_VERSION" ]; then
            echo "::error::installed wrangler is ${installed}, pin is ${WRANGLER_VERSION}"
            exit 1
          fi
      - name: Deploy the production Worker
        id: deploy
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          GIT_SHA: ${{ github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          set -Eeuo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID"
            echo "::error::on the production environment (docs/ci.md)"
            exit 1
          fi
          # --env="": wrangler.json also defines env.staging. An empty value is the
          # top-level Worker. Omitting it warns, and a later default could pick staging.
          ./node_modules/.bin/wrangler deploy --config wrangler.json --env="" \
            --no-autoconfig --no-install-skills \
            --message "release ${TAG}" --tag "$GIT_SHA"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          python "$GITHUB_WORKSPACE/scripts/read_wrangler_deploy.py" \
            "$WRANGLER_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the production Worker
        id: smoke
        env:
          BUILT_URL: ${{ steps.deploy.outputs.url }}
          CONFIGURED_URL: ${{ vars.DEPLOY_URL }}
        run: |
          set -Eeuo pipefail
          urls=()
          if [ -n "$BUILT_URL" ]; then
            urls+=("$BUILT_URL")
          fi
          if [ -n "$CONFIGURED_URL" ] && [ "$CONFIGURED_URL" != "$BUILT_URL" ]; then
            urls+=("$CONFIGURED_URL")
          fi
          if [ "${#urls[@]}" -eq 0 ]; then
            echo "::error::no URL to smoke-test"
            exit 1
          fi
          for target in "${urls[@]}"; do
            scripts/smoke_site.sh "$target" "$TAG" greenblacked-ai
          done
      - name: Roll back the production Worker
        if: failure() && steps.deploy.outputs.deployed == 'true'
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -Eeuo pipefail
          echo "::warning::the production deploy did not pass its smoke test; rolling back"
          if ! ./node_modules/.bin/wrangler rollback --config wrangler.json --env="" --yes \
            --message "Automatic rollback: failed smoke test in run ${GITHUB_RUN_ID}"; then
            echo "::error::rollback failed. The failed version may still be serving"
            echo "::error::roll it back from the Cloudflare dashboard"
            exit 1
          fi
