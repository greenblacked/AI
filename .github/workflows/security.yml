---
# Security checks. They aggregate into a `security` gate job at the bottom, which is a
# required status check alongside `ci` — a check nobody is required to pass is a check
# that gets ignored.
#
# Tool versions are pinned explicitly rather than floated: a scanner that silently
# changes its rule set between runs turns a green build into a statement about the
# scanner rather than about the code.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: '8.30.1'
  # The digest gitleaks publishes in `gitleaks_<version>_checksums.txt` on the release.
  # It is what turns a pinned version into a pinned artefact: a tag and a release asset
  # are both mutable, and the download is otherwise whatever that URL serves.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  ZIZMOR_VERSION: '1.30.1'
  # Pinned for the same reason: ruff 0.16 began formatting Python blocks inside
  # Markdown, so an unpinned upgrade would fail the build on skill prose that was
  # green the day before.
  RUFF_VERSION: '0.16.10'
  # The two agent-skill scanners. Each one's whole dependency tree is hashed in
  # .github/requirements/, and each version has to match the file that installs it.
  SKILL_SCANNER_VERSION: '2.3.1'
  # SkillSpector is not on PyPI, so it is installed from source at this commit, which is
  # what tag v2.13.1 names; that tag sits on a release branch, not on upstream's main.
  # The commit is checked after the fetch, so the tag moving cannot change what runs.
  SKILLSPECTOR_VERSION: '2.13.1'
  SKILLSPECTOR_COMMIT: 'f3b25697d76256998ca9d42c198d256258d4c035'

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # gitleaks reads history, not just the working tree: a secret that was
          # committed and then removed is still a leaked secret.
          fetch-depth: 0
      - name: Install gitleaks
        # Downloaded to disk and checked against a recorded digest before it is
        # unpacked, the way `lint-actions` fetches actionlint in ci.yml. Piping a
        # release straight into tar runs whatever that URL served this minute, which
        # is what `image-hardening` calls an unreviewed commit author in your build.
        # Bumping the version means bumping the digest beside it; if the two disagree
        # the job fails before the binary executes, which is the whole point.
        run: |
          set -Eeuo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 --retry-max-time 150 \
            --connect-timeout 20 --max-time 60 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          ./gitleaks version
      - name: Scan the working tree and history
        run: |
          set -Eeuo pipefail
          ./gitleaks dir . --redact --no-banner
          ./gitleaks git . --redact --no-banner

  workflows:
    name: workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      # Keyed on the job as well as on the file that records the pins: setup-python's
      # own pip cache carries no job identity, so the two jobs here would share one
      # entry and only the first to finish would ever populate it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-zizmor-${{ runner.os }}-${{ hashFiles('.github/workflows/security.yml') }}
      - name: Audit workflows with zizmor
        # zizmor looks for the things that actually compromise a repository through
        # CI: template injection into `run:` blocks, over-broad token permissions,
        # unpinned third-party actions, and `pull_request_target` used with a
        # checkout of untrusted code.
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet "zizmor==${ZIZMOR_VERSION}"
          zizmor --persona=regular --min-severity=medium .
        env:
          # Lets zizmor check whether a pinned SHA has drifted from its tag. Without a
          # token it silently runs the offline audits only.
          GH_TOKEN: ${{ github.token }}

  python:
    name: python security lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-ruff-${{ runner.os }}-${{ hashFiles('.github/workflows/security.yml') }}
      - run: |
          set -Eeuo pipefail
          python -m pip install "ruff==${RUFF_VERSION}"
      - name: Lint, including the bandit security rules
        run: |
          set -Eeuo pipefail
          ruff check --output-format=github .
          ruff format --check .

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v4.39.2
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26  # v4.39.2

  permissions-audit:
    name: permissions audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Every workflow must set a top-level permissions block that grants nothing
        # An absent `permissions:` block means the job inherits the repository default,
        # which is usually read and write on everything — but so does one that is
        # present and over-broad. Checking only that the line existed let
        # `permissions: write-all` through with the same silent, permanent effect as
        # having no block at all, so this also rejects that shorthand, its `read-all`
        # sibling, a single-line flow map granting `write` on any scope
        # (`{contents: write}`), and the block form of the same thing - quoted or not.
        # A trailing comment is stripped from the value first, and a comment at column
        # zero no longer ends the block scan, so `permissions:  # least privilege`
        # followed by `  contents: write` cannot hide the grant behind either one.
        run: |
          set -Eeuo pipefail
          bad=0
          shopt -s nullglob
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            line_no=$(grep -nE '^permissions:' "$file" | head -n1 | cut -d: -f1) || true
            if [ -z "$line_no" ]; then
              echo "::error file=$file,title=no permissions block::$file does not set top-level permissions"
              bad=1
              continue
            fi
            value=$(sed -n "${line_no}s/^permissions:[[:space:]]*//p" "$file")
            value=$(printf '%s\n' "$value" | sed -E 's/[[:space:]]*#.*$//')
            # Quotes stripped before every comparison below, so `write`, `"write"` and
            # 'write' are judged the same way whether they sit in a flow map or a block.
            normalised=$(printf '%s\n' "$value" | sed -E 's/["'"'"']//g')
            if printf '%s\n' "$normalised" | grep -qiE '^(write-all|read-all)[[:space:]]*$'; then
              echo "::error file=$file,title=over-broad permissions::$file sets top-level permissions: ${value}"
              bad=1
              continue
            fi
            if [ -n "$value" ]; then
              if [ "$value" = "{}" ]; then
                continue  # grants nothing
              fi
              if printf '%s\n' "$normalised" |
                grep -qE '(^\{|[,{])[[:space:]]*[A-Za-z_-]+[[:space:]]*:[[:space:]]*write[[:space:]]*($|[,}])'; then
                echo "::error file=$file,title=over-broad permissions::$file grants write at the top level: ${value}"
                bad=1
              fi
              continue
            fi
            block=$(awk -v start="$line_no" '
              NR <= start { next }
              /^[^[:space:]#]/ { exit }
              { print }
            ' "$file")
            writes=$(printf '%s\n' "$block" |
              sed -E 's/["'"'"']//g' |
              grep -E '^[[:space:]]+[A-Za-z_-]+:[[:space:]]*write[[:space:]]*(#.*)?$') || true
            if [ -n "$writes" ]; then
              echo "::error file=$file,title=over-broad permissions::$file grants write at the top level: ${writes}"
              bad=1
            fi
          done
          exit "$bad"
      - name: Every third-party action must be pinned to a commit SHA
        # Matching known-bad shapes let the likeliest regression through: this repo's
        # own convention is `uses: x@<sha>  # v7.0.1`, so keeping the comment and pasting a
        # tag over the SHA passed a check anchored at end-of-line. Inverted now - a ref
        # that is not forty hex characters fails, whatever it looks like.
        run: |
          set -Eeuo pipefail
          unpinned=0
          while IFS= read -r line; do
            file="${line%%:*}"
            echo "::error file=$file,title=unpinned action::${line#*:}"
            unpinned=1
          done < <(
            grep -nE '^[[:space:]]*(- )?uses: [^@]+@' .github/workflows/*.y*ml \
              | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true
          )
          exit "$unpinned"
      - name: Every job must set timeout-minutes
        # Without one a hung job runs to the six-hour platform default, which reads as
        # slow CI rather than broken CI and holds a runner the whole time. The
        # convention has held by habit since the workflows were written, and a habit is
        # not a gate: the job that forgets it is green, and stays green.
        #
        # Jobs are the two-space keys under `jobs:`; a job's own keys sit at four. The
        # walk refuses to vouch for a file it found no job in, because a parse that
        # silently matches nothing is the failure this whole job exists to avoid.
        run: |
          set -Eeuo pipefail
          missing=0
          shopt -s nullglob
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            seen=0
            while IFS=$'\t' read -r line job has; do
              seen=$((seen + 1))
              if [ "$has" -eq 0 ]; then
                echo "::error file=$file,line=$line,title=no timeout::job $job sets no timeout-minutes"
                missing=1
              fi
            done < <(
              awk '
                /^jobs:[[:space:]]*(#.*)?$/ { injobs = 1; next }
                injobs && /^[^[:space:]#]/ {
                  if (job != "") print jobline "\t" job "\t" has
                  job = ""; injobs = 0
                }
                injobs && /^  [A-Za-z0-9_.-]+:[[:space:]]*(#.*)?$/ {
                  if (job != "") print jobline "\t" job "\t" has
                  job = $1; sub(/:$/, "", job); jobline = NR; has = 0; next
                }
                injobs && /^    timeout-minutes:[[:space:]]/ { has = 1 }
                END { if (job != "") print jobline "\t" job "\t" has }
              ' "$file"
            )
            if [ "$seen" -eq 0 ]; then
              echo "::error file=$file,title=no jobs found::found no job here, so this check cannot vouch for it"
              missing=1
            fi
          done
          exit "$missing"
      - name: Every checkout must set persist-credentials false
        # actions/checkout writes the job token into .git/config by default, where any
        # later step — including anything a script it runs pulls in — can read it and
        # push with it. Nothing here pushes from CI, so nothing here needs the
        # credential to survive the checkout step.
        #
        # The awk walk is cross-checked against a plain grep count: if the two disagree
        # the file has a shape this does not understand, and it fails rather than
        # reporting a clean run over steps it never saw.
        run: |
          set -Eeuo pipefail
          persisted=0
          shopt -s nullglob
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            expected=$(grep -cE 'uses:[[:space:]]*actions/checkout@' "$file" || true)
            found=0
            while IFS=$'\t' read -r line ok; do
              found=$((found + 1))
              if [ "$ok" -eq 0 ]; then
                msg='does not set persist-credentials: false'
                echo "::error file=$file,line=$line,title=credential persisted::checkout $msg"
                persisted=1
              fi
            done < <(
              awk '
                /uses:[[:space:]]*actions\/checkout@/ { pending = 1; at = NR; ok = 0; next }
                pending && /persist-credentials:[[:space:]]*false/ { ok = 1 }
                pending && /^[[:space:]]*- / { print at "\t" ok; pending = 0 }
                END { if (pending) print at "\t" ok }
              ' "$file"
            )
            if [ "$found" -ne "$expected" ]; then
              echo "::error file=$file,title=unparsed checkout::saw $found checkout step(s) where grep counts $expected"
              persisted=1
            fi
          done
          exit "$persisted"

  skill-scanner:
    name: cisco skill scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: >-
            pip-skill-scanner-${{ runner.os }}-${{
            hashFiles('.github/requirements/skill-scanner.txt') }}
      # Into a virtual environment of its own, so the scanner's dependencies never share
      # an interpreter with anything else the job runs. Wheels only, every one hashed.
      - name: Install the Cisco AI skill scanner
        run: |
          set -Eeuo pipefail
          python -m venv "$RUNNER_TEMP/skill-scanner-venv"
          "$RUNNER_TEMP/skill-scanner-venv/bin/python" -m pip install --quiet \
            --require-hashes --only-binary=:all: -r .github/requirements/skill-scanner.txt
          "$RUNNER_TEMP/skill-scanner-venv/bin/python" -I -c '
          import importlib.metadata, os, sys
          found = importlib.metadata.version("cisco-ai-skill-scanner")
          want = os.environ["SKILL_SCANNER_VERSION"]
          sys.exit(0 if found == want else f"installed {found}, pinned {want}")
          '
      # Static analysers only. --use-llm, --use-virustotal, --use-aidefense, --use-osv,
      # --enable-meta and --adjudicate would each send skill text or hashes to a third
      # party or need a key, and none is passed. The reviewed policy suppresses each
      # finding triaged as a false positive by rule, skill and file; anything else at
      # high or critical fails the job.
      - name: Scan every skill
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/skill-scanner"
          mkdir -p "$out"
          # The scanner echoes skill text, which a pull request controls, so its output
          # goes to the artifact rather than the job log, where a line starting with
          # `::` would be read as a workflow command.
          rc=0
          "$RUNNER_TEMP/skill-scanner-venv/bin/skill-scanner" scan-all plugins --recursive \
            --policy .github/skill-scan/cisco-policy.yaml \
            --format sarif --output "$out/skill-scanner.sarif" \
            --format json --output-json "$out/skill-scanner.json" \
            --fail-on-severity high >"$out/skill-scanner.log" 2>&1 || rc=$?
          # Every field comes from the report verbatim, so each line is made inert the
          # way scripts/skill_scan_gate.py makes its text inert: a carriage return or
          # newline becomes a space, so a path cannot start a line of its own, `##[`
          # becomes `## [`, and a line that would still open with `::` is broken.
          if [ -f "$out/skill-scanner.json" ]; then
            jq -r '.results[] | .skill_path as $skill | .findings[]?
              | select(.severity == "HIGH" or .severity == "CRITICAL")
              | "  \(.severity) \(.rule_id) \($skill)/\(.file_path):\(.line_number)"
              | gsub("[\r\n]"; " ") | gsub("##\\["; "## [")
              | sub("^(?<lead>\\s*)::"; "\(.lead): :")' \
              "$out/skill-scanner.json"
          fi
          if [ "$rc" -ne 0 ]; then
            msg="skill-scanner exited $rc; findings above, full output in the skill-scanner artifact"
            echo "::error title=cisco skill scan::$msg"
            exit "$rc"
          fi
      # A scan that found fewer skills than the tree holds is a scan that skipped some,
      # and would otherwise read as a clean one.
      - name: Check every skill was scanned
        run: |
          set -Eeuo pipefail
          expected=$(find plugins -mindepth 4 -maxdepth 4 -path 'plugins/*/skills/*/SKILL.md' -type f | wc -l)
          scanned=$(jq -er '.summary.total_skills_scanned' "$RUNNER_TEMP/skill-scanner/skill-scanner.json")
          if ! [[ "$scanned" =~ ^[0-9]+$ ]]; then
            echo "::error title=skill scan incomplete::the report gave no skill count"
            exit 1
          fi
          if [ "$scanned" -ne "$expected" ]; then
            echo "::error title=skill scan incomplete::scanned $scanned skill(s) of $expected"
            exit 1
          fi
          echo "scanned $scanned of $expected skills"
      # Neither scanner has a subagent or command type, so each definition is copied into a
      # one-file skill (a shim) and scanned as one: the prompt-injection, exfiltration and
      # obfuscation rules then read its instructions and frontmatter. They do not analyse
      # its tool grant. The shim script refuses a symbolic link, an odd file name and a
      # repeated id. The count of what it wrapped comes from `git ls-files`, never from
      # the script, so a script that quietly skips a file cannot also report its own total.
      - name: Wrap every subagent and command as a one-file skill
        run: |
          set -Eeuo pipefail
          shims="$RUNNER_TEMP/definition-shims"
          python3 scripts/definition_shims.py --out "$shims" --all
          globs=(':(glob,icase)plugins/*/agents/**/*.md' ':(glob,icase)plugins/*/commands/**/*.md'
            ':(glob,icase).claude/agents/**/*.md' ':(glob,icase).claude/commands/**/*.md')
          expected=$(git ls-files -z -- "${globs[@]}" |
            tr -cd '\0' | wc -c)
          wrapped=$(wc -l < "$shims/map.tsv")
          if [ "$wrapped" -ne "$expected" ]; then
            echo "::error title=definition scan::wrapped $wrapped definition(s) where git lists $expected"
            exit 1
          fi
          echo "$wrapped subagent and command file(s) wrapped"
      # The same policy, severity and offline analysers as the skills above. The summary
      # names a finding by its shim id, `agent--<plugin>--<name>` or `command--<plugin>--<name>`
      # (`claude` for .claude/), which is also how the policy names it.
      - name: Scan every subagent and command
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/skill-scanner"
          mkdir -p "$out"
          rc=0
          "$RUNNER_TEMP/skill-scanner-venv/bin/skill-scanner" scan-all "$RUNNER_TEMP/definition-shims" \
            --policy .github/skill-scan/cisco-policy.yaml \
            --format sarif --output "$out/definitions.sarif" \
            --format json --output-json "$out/definitions.json" \
            --fail-on-severity high >"$out/definitions.log" 2>&1 || rc=$?
          # Made inert the way the skill summary above is.
          if [ -f "$out/definitions.json" ]; then
            jq -r '.results[] | (.skill_path | split("/") | last) as $id | .findings[]?
              | select(.severity == "HIGH" or .severity == "CRITICAL")
              | "  \(.severity) \(.rule_id) \($id)/\(.file_path):\(.line_number)"
              | gsub("[\r\n]"; " ") | gsub("##\\["; "## [")
              | sub("^(?<lead>\\s*)::"; "\(.lead): :")' \
              "$out/definitions.json"
          fi
          if [ "$rc" -ne 0 ]; then
            msg="skill-scanner exited $rc; findings above, full output in the skill-scanner artifact"
            echo "::error title=cisco definition scan::$msg"
            exit "$rc"
          fi
      - name: Check every subagent and command was scanned
        run: |
          set -Eeuo pipefail
          globs=(':(glob,icase)plugins/*/agents/**/*.md' ':(glob,icase)plugins/*/commands/**/*.md'
            ':(glob,icase).claude/agents/**/*.md' ':(glob,icase).claude/commands/**/*.md')
          expected=$(git ls-files -z -- "${globs[@]}" |
            tr -cd '\0' | wc -c)
          scanned=$(jq -er '.summary.total_skills_scanned' "$RUNNER_TEMP/skill-scanner/definitions.json")
          if ! [[ "$scanned" =~ ^[0-9]+$ ]]; then
            echo "::error title=definition scan incomplete::the report gave no count"
            exit 1
          fi
          if [ "$scanned" -ne "$expected" ]; then
            echo "::error title=definition scan incomplete::scanned $scanned subagent and command file(s) of $expected"
            exit 1
          fi
          echo "scanned $scanned of $expected subagents and commands"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: skill-scanner-report
          path: ${{ runner.temp }}/skill-scanner
          if-no-files-found: warn
          retention-days: 14

  skillspector:
    name: skillspector skill scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # A pull request scans only the skills it changes, which needs its base commit.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: >-
            pip-skillspector-${{ runner.os }}-${{
            hashFiles('.github/requirements/skillspector.txt') }}
      # Fetched by commit rather than as a GitHub tarball: an archive's bytes are not
      # guaranteed stable, so there is no digest to record for one, while a commit id
      # names its content. Dependencies are hashed wheels; SkillSpector itself is built
      # with the hashed hatchling and no network, into a virtual environment of its own.
      - name: Install SkillSpector at its pinned commit
        run: |
          set -Eeuo pipefail
          src="$RUNNER_TEMP/skillspector-src"
          git init --quiet "$src"
          git -C "$src" fetch --quiet --depth 1 https://github.com/NVIDIA/SkillSpector.git "$SKILLSPECTOR_COMMIT"
          git -C "$src" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$src" rev-parse HEAD)" = "$SKILLSPECTOR_COMMIT"
          venv="$RUNNER_TEMP/skillspector-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet \
            --require-hashes --only-binary=:all: -r .github/requirements/skillspector.txt
          "$venv/bin/python" -m pip install --quiet --no-deps --no-build-isolation "$src"
          "$venv/bin/python" -I -c '
          import importlib.metadata, os, sys
          found = importlib.metadata.version("skillspector")
          want = os.environ["SKILLSPECTOR_VERSION"]
          sys.exit(0 if found == want else f"installed {found}, pinned {want}")
          '
      # A pull request scans the skills and the subagent and command files it adds or
      # changes; every other event scans all of them, and so does a pull request that
      # changes the scan's own configuration (this workflow, the accepted list, the
      # scanner's lock, the gate or the script that wraps definitions), since that can
      # change the verdict on a file the diff never touches. --no-renames makes a moved
      # file count as added at its new path, and the base commit arrives through env:,
      # never through an expression in the script. A definition is scanned through a
      # one-file skill that scripts/definition_shims.py writes; its manifest line is the
      # shim id, a tab and the source path. How many it wrapped is checked against a
      # count this step makes itself from git, not from the script's own output.
      - name: Choose what to scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -Eeuo pipefail
          results="$RUNNER_TEMP/skillspector"
          shims="$RUNNER_TEMP/definition-shims"
          mkdir -p "$results"
          manifest="$results/skills.txt"
          # Every .md, in any case and at any depth, below agents/ and commands/, because Claude
          # Code's loader reads them all (a README included); the script refuses any that is
          # not a plain definition, so the count and the script cannot quietly disagree.
          globs=(':(glob,icase)plugins/*/agents/**/*.md' ':(glob,icase)plugins/*/commands/**/*.md'
            ':(glob,icase).claude/agents/**/*.md' ':(glob,icase).claude/commands/**/*.md')
          # A link inside a skill can point outside plugins/, so editing its target would
          # change what is scanned without selecting the skill; the same goes for a link
          # standing in for a definition. Counted, never listed.
          links=$(git ls-files -s -z -- plugins .claude | tr '\0' '\n' | grep -c '^120000 ' || true)
          if [ "$links" -gt 0 ]; then
            msg="a symbolic link under plugins/ or .claude/ ($links found); commit the file itself"
            echo "::error title=skill scan::$msg"
            exit 1
          fi
          scan_all=1
          if [ "$EVENT_NAME" = pull_request ]; then
            if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=skill scan::no usable base commit for this pull request"
              exit 1
            fi
            base=$(git merge-base "$BASE_SHA" HEAD)
            # Counted rather than listed, so no file name a pull request chose reaches the log.
            config=$(git diff --no-renames -z --name-only "$base" HEAD -- \
              .github/workflows/security.yml .github/skill-scan \
              .github/requirements/skillspector.txt scripts/skill_scan_gate.py \
              scripts/definition_shims.py | tr -cd '\0' | wc -c)
            if [ "$config" -gt 0 ]; then
              echo "this pull request changes the skill scan configuration, so every skill is scanned"
            else
              scan_all=0
              git diff --no-renames -z --name-only "$base" HEAD -- plugins |
                while IFS= read -r -d '' path; do
                  if [[ "$path" =~ ^(plugins/[^/]+/skills/[^/]+)/ ]] && [ -f "${BASH_REMATCH[1]}/SKILL.md" ]; then
                    printf '%s\n' "${BASH_REMATCH[1]}"
                  fi
                done | sort -u > "$manifest"
            fi
          fi
          if [ "$scan_all" -eq 1 ]; then
            find plugins -mindepth 4 -maxdepth 4 -path 'plugins/*/skills/*/SKILL.md' -type f -print0 |
              while IFS= read -r -d '' path; do
                printf '%s\n' "${path%/SKILL.md}"
              done | sort > "$manifest"
            if ! [ -s "$manifest" ]; then
              echo "::error title=skill scan::found no skill to scan"
              exit 1
            fi
          fi
          # Every name has to be a plain skill directory before it reaches a file name or
          # a command line; one that is not fails here rather than going unscanned.
          while IFS= read -r skill; do
            if ! [[ "$skill" =~ ^plugins/[A-Za-z0-9][A-Za-z0-9._-]*/skills/[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
              echo "::error title=skill scan::refusing to scan a directory with an unexpected name"
              exit 1
            fi
          done < "$manifest"
          if [ "$scan_all" -eq 1 ]; then
            python3 scripts/definition_shims.py --out "$shims" --all
            expected=$(git ls-files -z -- "${globs[@]}" |
              tr -cd '\0' | wc -c)
          else
            python3 scripts/definition_shims.py --out "$shims" --changed="$BASE_SHA"
            expected=0
            while IFS= read -r -d '' path; do
              if [ -e "$path" ]; then
                expected=$((expected + 1))
              fi
            done < <(git diff --no-renames -z --name-only "$base" HEAD -- "${globs[@]}")
          fi
          wrapped=$(wc -l < "$shims/map.tsv")
          if [ "$wrapped" -ne "$expected" ]; then
            echo "::error title=skill scan::wrapped $wrapped definition(s) where git lists $expected"
            exit 1
          fi
          tab=$'\t'
          part='[a-z0-9]+(-[a-z0-9]+)*'
          def_re="^(agent--${part}--${part}${tab}(plugins/${part}|\.claude)/agents/${part}\.md"
          def_re+="|command--${part}--${part}(--${part})*${tab}(plugins/${part}|\.claude)/commands/(${part}/)*(${part}|README)\.md)(${tab}[0-9]+)?\$"
          while IFS= read -r line; do
            if ! [[ "$line" =~ $def_re ]]; then
              echo "::error title=skill scan::refusing to scan a definition with an unexpected name"
              exit 1
            fi
          done < "$shims/map.tsv"
          cat "$shims/map.tsv" >> "$manifest"
          if ! [ -s "$manifest" ]; then
            msg="this pull request changes no skill or definition, so there is nothing to scan"
            echo "::notice title=skill scan::$msg"
          fi
          echo "$(wc -l < "$manifest") skill(s) and definition(s) to scan"
      # One process per skill or definition shim, four at a time: `scan -r` stops at 32
      # skills, reads one level deep and refuses a baseline. --no-llm keeps skill text on the runner; the
      # one network call left is SC4's dependency lookup at api.osv.dev, made only for
      # a declared dependency file, of which this tree has none. Exit 1 is a risk score
      # and is judged by the gate below; the exit code of each scan is kept for it.
      - name: Scan the chosen skills and definitions
        run: |
          set -Eeuo pipefail
          results="$RUNNER_TEMP/skillspector"
          shims="$RUNNER_TEMP/definition-shims"
          scanner="$RUNNER_TEMP/skillspector-venv/bin/skillspector"
          running=0
          while IFS= read -r entry; do
            id="${entry%%$'\t'*}"
            if [ "$id" = "$entry" ]; then
              rest="${entry#plugins/}"
              name="${rest%%/*}__${entry##*/}"
              dir="$entry"
            else
              name="$id"
              dir="$shims/$id"
            fi
            (
              rc=0
              "$scanner" scan "$dir" --no-llm --format sarif -o "$results/$name.sarif" \
                > "$results/$name.log" 2>&1 || rc=$?
              printf '%s\n' "$rc" > "$results/$name.rc"
            ) &
            running=$((running + 1))
            if [ "$running" -ge 4 ]; then
              wait -n || true
              running=$((running - 1))
            fi
          done < "$results/skills.txt"
          wait
      # Fails on any high or critical finding not in the reviewed list, on a scan that
      # errored or left no report, and on a reviewed entry with no reason. A scan that
      # ran out of one of SkillSpector's time budgets is neither clean nor a finding:
      # the first pass lists it and exits 3, each listed skill or definition is rescanned
      # on its own, one at a time, and the final pass fails one that runs out of time again.
      - name: Gate on new high and critical findings
        run: |
          set -Eeuo pipefail
          results="$RUNNER_TEMP/skillspector"
          shims="$RUNNER_TEMP/definition-shims"
          run_gate() {
            python3 scripts/skill_scan_gate.py \
              --manifest "$results/skills.txt" \
              --results "$results" \
              --accepted .github/skill-scan/skillspector-accepted.json "$@"
          }
          first=0
          run_gate --incomplete-out "$results/rescan.txt" || first=$?
          if [ "$first" -ne 3 ]; then
            exit "$first"
          fi
          scanner="$RUNNER_TEMP/skillspector-venv/bin/skillspector"
          tab=$'\t'
          part='[a-z0-9]+(-[a-z0-9]+)*'
          skill_re='^plugins/[A-Za-z0-9][A-Za-z0-9._-]*/skills/[A-Za-z0-9][A-Za-z0-9._-]*$'
          def_re="^(agent--${part}--${part}${tab}(plugins/${part}|\.claude)/agents/${part}\.md"
          def_re+="|command--${part}--${part}(--${part})*${tab}(plugins/${part}|\.claude)/commands/(${part}/)*(${part}|README)\.md)(${tab}[0-9]+)?\$"
          while IFS= read -r entry; do
            # The same checks the selection step makes, and the entry has to be one it chose.
            if [[ "$entry" =~ $skill_re ]]; then
              rest="${entry#plugins/}"
              name="${rest%%/*}__${entry##*/}"
              dir="$entry"
            elif [[ "$entry" =~ $def_re ]]; then
              name="${entry%%$'\t'*}"
              dir="$shims/$name"
            else
              echo "::error title=skill scan::refusing to rescan a directory with an unexpected name"
              exit 1
            fi
            if ! grep -qxF -- "$entry" "$results/skills.txt"; then
              echo "::error title=skill scan::refusing to rescan a directory with an unexpected name"
              exit 1
            fi
            echo "rescanning ${entry%%$'\t'*} after SkillSpector ran out of time"
            rc=0
            "$scanner" scan "$dir" --no-llm --format sarif -o "$results/$name.sarif" \
              > "$results/$name.log" 2>&1 || rc=$?
            printf '%s\n' "$rc" > "$results/$name.rc"
          done < "$results/rescan.txt"
          run_gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: skillspector-report
          path: ${{ runner.temp }}/skillspector
          if-no-files-found: warn
          retention-days: 14

  security:
    # The required status check for this workflow. `ci` in ci.yml is the other one;
    # between them they cover every job, and neither name changes when the jobs
    # behind it do.
    name: security
    if: always()
    needs:
      - secrets
      - workflows
      - python
      - codeql
      - permissions-audit
      - skill-scanner
      - skillspector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify every required security job passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_job_results.py \
            secrets workflows python codeql permissions-audit skill-scanner skillspector
