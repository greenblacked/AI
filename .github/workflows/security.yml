---
# Security checks. They aggregate into a `security` gate job at the bottom, which is a
# required status check alongside `ci` — a check nobody is required to pass is a check
# that gets ignored.
#
# Tool versions are pinned explicitly rather than floated: a scanner that silently
# changes its rule set between runs turns a green build into a statement about the
# scanner rather than about the code.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  ZIZMOR_VERSION: '1.29.0'
  # Pinned for the same reason: ruff 0.16 began formatting Python blocks inside
  # Markdown, so an unpinned upgrade would fail the build on skill prose that was
  # green the day before.
  RUFF_VERSION: '0.16.1'

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # gitleaks reads history, not just the working tree: a secret that was
          # committed and then removed is still a leaked secret.
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -Eeuo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL "${url}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
      - name: Scan the working tree and history
        run: |
          set -Eeuo pipefail
          ./gitleaks dir . --redact --no-banner
          ./gitleaks git . --redact --no-banner

  workflows:
    name: workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Audit workflows with zizmor
        # zizmor looks for the things that actually compromise a repository through
        # CI: template injection into `run:` blocks, over-broad token permissions,
        # unpinned third-party actions, and `pull_request_target` used with a
        # checkout of untrusted code.
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet "zizmor==${ZIZMOR_VERSION}"
          zizmor --persona=regular --min-severity=medium .
        env:
          # Lets zizmor check whether a pinned SHA has drifted from its tag. Without a
          # token it silently runs the offline audits only.
          GH_TOKEN: ${{ github.token }}

  python:
    name: python security lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip "ruff==${RUFF_VERSION}"
      - name: Lint, including the bandit security rules
        run: |
          ruff check --output-format=github .
          ruff format --check .

  codeql:
    name: codeql
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6

  permissions-audit:
    name: permissions audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Every workflow must set a top-level permissions block
        # An absent `permissions:` block means the job inherits the repository
        # default, which is usually read and write on everything. This is a
        # one-line check because the failure is silent and permanent.
        run: |
          set -Eeuo pipefail
          missing=0
          shopt -s nullglob
          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            if ! grep -qE '^permissions:' "$file"; then
              echo "::error file=$file,title=no permissions block::$file does not set top-level permissions"
              missing=1
            fi
          done
          exit "$missing"
      - name: Every third-party action must be pinned to a commit SHA
        # Matching known-bad shapes let the likeliest regression through: this repo's
        # own convention is `uses: x@<sha>  # v7`, so keeping the comment and pasting a
        # tag over the SHA passed a check anchored at end-of-line. Inverted now - a ref
        # that is not forty hex characters fails, whatever it looks like.
        run: |
          set -Eeuo pipefail
          unpinned=0
          while IFS= read -r line; do
            file="${line%%:*}"
            echo "::error file=$file,title=unpinned action::${line#*:}"
            unpinned=1
          done < <(
            grep -nE '^[[:space:]]*(- )?uses: [^@]+@' .github/workflows/*.y*ml \
              | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true
          )
          exit "$unpinned"

  security:
    # The required status check for this workflow. `ci` in ci.yml is the other one;
    # between them they cover every job, and neither name changes when the jobs
    # behind it do.
    name: security
    if: always()
    needs:
      - secrets
      - workflows
      - python
      - codeql
      - permissions-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any security job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
