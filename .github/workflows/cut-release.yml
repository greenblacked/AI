---
# Cuts a release from the Actions tab: run it on `main` with a version whose CHANGELOG
# section the prepare pull request has already merged. It creates the annotated tag
# `vX.Y.Z` through the API and then dispatches release.yml on that tag. It does not
# publish anything itself, because the `production` environment admits only `v*` tags
# and a run on `main` could not deploy.
#
# The dispatch is not a convenience. A tag created with GITHUB_TOKEN does not start
# release.yml's tag-push trigger, and `workflow_dispatch` is the one event a
# GITHUB_TOKEN call does start. release.yml then runs with a tag ref, so every check
# there (ancestor of main, validation, packaging, the environment rule) is unchanged.
#
# `make release` and a hand-pushed tag still work and reach the same workflow.
name: Cut release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, X.Y.Z, with its CHANGELOG section already on main'
        required: true
        type: string

permissions: {}

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: cut
    # A dispatch can be pointed at any branch; only main may cut a release.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Spent on creating one annotated tag object and its refs/tags/vX.Y.Z ref through
      # the API, never on pushing code.
      contents: write
      # Spent on dispatching release.yml on that new tag, nothing else.
      actions: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Refuse to run anywhere but main
        # The job-level `if` already skips a dispatch on another branch. This repeats the
        # check as a step so that removing the `if` later still cannot cut a release
        # from a branch.
        run: |
          set -Eeuo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::releases are cut from main, not $GITHUB_REF" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
          # No `cache:` here on purpose; release.yml's comment gives the reason. This
          # workflow ends in a publish, and a restored cache is input it did not build.

      - name: Check the version is ready to release
        # Strict X.Y.Z first, so nothing later builds a ref name or a JSON body from
        # free text. Then the same validation `make release` applies, minus the checks
        # that only make sense in a local clone: a non-empty CHANGELOG section, no
        # such tag on origin, a version greater than every existing tag, and HEAD
        # equal to origin/main.
        run: |
          set -Eeuo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z with no leading v, got: $VERSION" >&2
            exit 1
          fi
          python scripts/release.py check "$VERSION"

      - name: Write the release notes from CHANGELOG.md
        run: |
          set -Eeuo pipefail
          python scripts/release.py notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          echo "NOTES_FILE=$RUNNER_TEMP/notes.md" >> "$GITHUB_ENV"

      - name: Create the annotated tag object
        # The message is the CHANGELOG section, passed as a JSON string built by Python
        # so it reaches the API verbatim, with its `###` subheadings and any quote or
        # backslash intact. The tagger is whoever dispatched the run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -Eeuo pipefail
          request="$RUNNER_TEMP/tag-request.json"
          python - "$NOTES_FILE" "$request" <<'PY'
          import json
          import os
          import sys

          notes_path, request_path = sys.argv[1:3]
          with open(notes_path, encoding="utf-8") as handle:
              message = handle.read().rstrip("\n") + "\n"
          actor = os.environ["ACTOR"]
          body = {
              "tag": "v" + os.environ["VERSION"],
              "message": message,
              "object": os.environ["GITHUB_SHA"],
              "type": "commit",
              "tagger": {
                  "name": actor,
                  "email": os.environ["ACTOR_ID"] + "+" + actor + "@users.noreply.github.com",
              },
          }
          with open(request_path, "w", encoding="utf-8") as handle:
              json.dump(body, handle)
          PY
          tag_sha=$(gh api "repos/$GH_REPO/git/tags" --input "$request" --jq .sha)
          echo "TAG_SHA=$tag_sha" >> "$GITHUB_ENV"

      - name: Create the tag ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          gh api "repos/$GH_REPO/git/refs" \
            -f ref="refs/tags/v$VERSION" -f sha="$TAG_SHA" --silent
          echo "::notice::created v$VERSION at $GITHUB_SHA"

      - name: Dispatch the release workflow on the tag
        # A tag made with GITHUB_TOKEN starts nothing by itself; see the header.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if ! gh workflow run release.yml --ref "v$VERSION"; then
            echo "::error::v$VERSION exists but release.yml was not dispatched." >&2
            echo "::error::Run Release from the Actions tab on the v$VERSION tag." >&2
            exit 1
          fi
          runs="$GITHUB_SERVER_URL/$GH_REPO/actions/workflows/release.yml"
          echo "::notice::dispatched release.yml on v$VERSION: $runs"
