---
# Actions are pinned to a full-length commit SHA, which is the only immutable
# reference — a tag can be moved. The comment names the exact release tag that SHA
# belongs to, which is what lets Dependabot recognise and bump them; a floating
# `# v7` goes stale the moment upstream moves the major tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Deliberately no `paths:` filter. A workflow skipped by a path filter leaves its
# check Pending forever, and a pull request that requires that check can then never
# merge. This repository is small enough that running everything is cheaper than the
# failure mode.

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-skills:
    name: validate skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate every skill, subagent and the marketplace manifest
        # `--strict` fails on warnings too. They are warnings because each is a
        # judgement call rather than a rule, but a warning nobody has to clear is a
        # warning that accumulates until the whole category is ignored.
        run: PYTHONPATH=src python -m skillcheck . --strict

  validate-plugin:
    name: validate plugin manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Validate the marketplace and plugin manifests
        # The schema's source of truth is the Zod definition inside the CLI itself, so
        # this checks against the real thing rather than against a copy of it that
        # would silently fall behind. The version is pinned for the same reason the
        # scanners are: a validator that changes underneath you turns a green build
        # into a statement about the validator.
        run: |
          set -Eeuo pipefail
          npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate . \
            | tee validate.log
          # `plugin validate` exits 0 even when it warns, so a new warning class would
          # land silently — exactly the failure this repository rejects for skillcheck's
          # own warnings. The missing-version warnings are expected and deliberate: the
          # source is a git ref, so Claude Code derives the version from the commit SHA
          # and installers track every commit rather than waiting for a manual bump.
          # Anything else is new and fails the build.
          unexpected=$(grep -E '^[[:space:]]+> ' validate.log \
            | grep -v 'version: No version specified' || true)
          if [ -n "${unexpected}" ]; then
            echo "::error::plugin validate reported an unexpected warning"
            echo "${unexpected}"
            exit 1
          fi
        env:
          CLAUDE_CODE_VERSION: '2.1.221'

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The validator claims to need nothing but the standard library. Running it
        # on four interpreters is the cheapest way to keep that claim true.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest coverage
      # The floor is a ratchet, not a target: it sits below the measured figure so a
      # change that quietly drops a script back to untested fails here rather than
      # being noticed months later. Raise it in pyproject.toml when coverage rises.
      - run: |
          set -Eeuo pipefail
          PYTHONPATH=src python -m coverage run -m pytest
          # The summary is written before the floor is enforced, so a failing run
          # still shows which file fell.
          python -m coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report

  catalogue:
    name: check catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Every plugin is inside its listing ceiling
        # The runtime drops the descriptions of a plugin's least-used skills once the
        # listing overflows its budget, and says nothing: they stay invocable by name
        # and stop being chosen on their own. Re-cutting the plugins fixed that once;
        # this is what stops it growing back.
        run: python scripts/check_listing_budget.py .
      - name: The README still describes what is in the repository
        # A catalogue nobody checks is a catalogue that drifts. This one has, twice,
        # both times after the plugins were re-cut.
        run: python scripts/check_readme.py .
      - name: Every skill still flattens into a file that stands alone
        # The portable export is how this library reaches ChatGPT, Grok and anything
        # else without a skills runtime. Flattening inlines each `references/` file and
        # rewrites the pointer that named it; a pointer that survives as a path is a
        # dangling reference reintroduced at the boundary, for a reader who has no
        # filesystem to resolve it against.
        run: PYTHONPATH=src python scripts/export_portable.py . --check

  spelling:
    name: lint spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip "codespell==${CODESPELL_VERSION}"
        env:
          CODESPELL_VERSION: '2.4.3'
      - name: Check spelling
        # This ran weekly with only_warn set, which is the shape of check this
        # repository rejects everywhere else: nobody had to clear it, so nobody read
        # it. The false positives are listed in pyproject.toml with the reason each is
        # one, which is what lets the gate sit at zero and mean something.
        run: codespell

  lint-markdown:
    name: lint markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

  lint-yaml:
    name: lint yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip yamllint
      - run: yamllint --strict --format github .

  lint-actions:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        # actionlint also runs shellcheck over every inline `run:` block, which is
        # where all of this repository's shell actually lives.
        #
        # Downloaded at a pinned version and checked against a recorded digest rather
        # than piped from a script on a moving branch. `image-hardening` calls
        # `curl | bash` "an unreviewed commit author in your build"; a repository that
        # publishes that advice should not run CI that way.
        run: |
          set -Eeuo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" actionlint
          ./actionlint -color
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

  links:
    name: check links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check in-repository links
        # `--offline` only resolves local paths. External links flake, and a gate
        # that flakes is a gate people learn to ignore; the network check runs
        # weekly in scheduled.yml instead.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Build a .skill archive for every skill
        run: PYTHONPATH=src python scripts/package_skills.py
      - name: Every archive holds a loadable skill
        # Building without error only proves the zip was written. What the upload route
        # needs is a SKILL.md at the archive root whose `name` matches the archive, and
        # a broken layout would ship silently: the build is green and the install is
        # what fails, for someone else, later.
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python - <<'EOF'
          import pathlib
          import zipfile

          from skillcheck.frontmatter import parse

          archives = sorted(pathlib.Path("dist").glob("*.skill"))
          if not archives:
              raise SystemExit("no archives in dist/")
          for archive in archives:
              stem = archive.stem
              with zipfile.ZipFile(archive) as bundle:
                  bad = bundle.testzip()
                  if bad is not None:
                      raise SystemExit(f"{archive}: corrupt member {bad}")
                  member = f"{stem}/SKILL.md"
                  if member not in bundle.namelist():
                      raise SystemExit(f"{archive}: no {member} in the archive")
                  values = parse(bundle.read(member).decode("utf-8")).values
              if values.get("name") != stem:
                  raise SystemExit(f"{archive}: declares name {values.get('name')!r}")
          print(f"{len(archives)} archive(s) verified")
          EOF
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: skills
          path: dist/*.skill
          if-no-files-found: error

  ci:
    # One of the two required status checks; `security` in security.yml is the
    # other. Requiring the individual jobs instead would break the moment the test
    # matrix changes, because a matrix job's check name carries its parameters.
    name: ci
    if: always()
    needs:
      - validate-skills
      - validate-plugin
      - test
      - catalogue
      - spelling
      - lint-markdown
      - lint-yaml
      - lint-actions
      - links
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
