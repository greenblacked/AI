---
# Actions are pinned to a full-length commit SHA, which is the only immutable
# reference — a tag can be moved. The comment names the exact release tag that SHA
# belongs to, which is what lets Dependabot recognise and bump them; a floating
# `# v7` goes stale the moment upstream moves the major tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Deliberately no `paths:` filter. A workflow skipped by a path filter leaves its
# check Pending forever, and a pull request that requires that check can then never
# merge. This repository is small enough that running everything is cheaper than the
# failure mode.

permissions: {}

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every tool this workflow installs or downloads, pinned, for the reason security.yml
# gives: a tool that changes its rules underneath you turns a green build into a
# statement about the tool rather than about the repository. They sit at workflow level
# rather than beside the step that uses each, so that a cache key can name one and so
# `make lint` can read one out with a single sed.
env:
  CLAUDE_CODE_VERSION: '2.1.278'
  CODESPELL_VERSION: '2.4.3'
  # yamllint, pytest and coverage were the three that floated. A yamllint release that
  # adds a rule reddens the build on YAML nobody touched, which is exactly what got ruff
  # pinned; a pytest major can change collection under a suite that has not moved.
  YAMLLINT_VERSION: '1.38.0'
  PYTEST_VERSION: '9.1.1'
  COVERAGE_VERSION: '7.16.1'
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

jobs:
  validate-skills:
    name: validate skills
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate every skill, subagent and the marketplace manifest
        # `--strict` fails on warnings too. They are warnings because each is a
        # judgement call rather than a rule, but a warning nobody has to clear is a
        # warning that accumulates until the whole category is ignored.
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python -m skillcheck . --strict

  validate-plugin:
    name: validate plugin manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'
      - name: Cache the Claude CLI download
        # `setup-node`'s own cache needs a lockfile and there is none here: the CLI
        # arrives through npx rather than as a dependency. Keying on the pin is the
        # same idea by hand — a new key when the version moves, a hit when it has not.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-claude-code-${{ env.CLAUDE_CODE_VERSION }}
      - name: Validate the marketplace and plugin manifests
        # The schema's source of truth is the Zod definition inside the CLI itself, so
        # this checks against the real thing rather than against a copy of it that
        # would silently fall behind. The version is pinned for the same reason the
        # scanners are: a validator that changes underneath you turns a green build
        # into a statement about the validator.
        run: |
          set -Eeuo pipefail
          npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate . \
            | tee validate.log
          # `plugin validate` exits 0 even when it warns, so a new warning class would
          # land silently — exactly the failure this repository rejects for skillcheck's
          # own warnings. The missing-version warnings are expected and deliberate: the
          # source is a git ref, so Claude Code derives the version from the commit SHA
          # and installers track every commit rather than waiting for a manual bump.
          # Anything else is new and fails the build.
          # The CLI marks each warning with an indented `❯` (U+276F), not an ASCII `>`.
          # This grep matched `> ` alone until the control below proved it had never
          # matched a line of real output, so it now takes either marker.
          unexpected=$(grep -E '^[[:space:]]+(>|❯) ' validate.log \
            | grep -v 'version: No version specified' || true)
          if [ -n "${unexpected}" ]; then
            echo "::error::plugin validate reported an unexpected warning"
            echo "${unexpected}"
            exit 1
          fi
          # The grep above depends on the marker the CLI prints before each warning. If
          # that changes it matches nothing, `unexpected` is empty, and a whole new
          # warning class lands green — the same way check_shell.py once reported "0
          # blocks parsed" and passed. The eight known warnings are the control, matched
          # by the same shape the check uses: finding none means the format moved, not
          # that the tree got cleaner, because a git-sourced marketplace always has them.
          # Counting the message text anywhere would still find eight after the marker
          # changed, and pass while the check had gone blind — which is how the ASCII
          # `>` above stayed wrong from the day it was written until this control caught
          # it.
          known=$(grep -cE '^[[:space:]]+(>|❯) .*version: No version specified' \
            validate.log || true)
          if [ "${known}" -eq 0 ]; then
            echo "::error::plugin validate printed none of the warnings this check is" \
              "written against. Either its output format moved, or the eight known" \
              "warnings were cleared; re-baseline this control against the new output"
            exit 1
          fi

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The validator claims to need nothing but the standard library. Running it
        # on four interpreters is the cheapest way to keep that claim true.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # setup-python's own `cache: pip` keys on the interpreter and the dependency file
      # and nothing else, so every job here on 3.13 would share one entry: the first to
      # finish saves its wheels, the rest restore a cache without theirs and, because
      # the key hit exactly, never save their own. The job name is what makes a key
      # identify what is in it. The rest of the key is the file that records the pins,
      # so it busts whenever that file changes — every pin change, and also edits that
      # change nothing a cache holds. Over-busting beats a key that lists each version
      # by hand and falls out of step with them silently.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: >-
            pip-test-${{ runner.os }}-${{ matrix.python-version }}-${{
            hashFiles('.github/workflows/ci.yml') }}
      - name: Install the test runner
        run: |
          set -Eeuo pipefail
          python -m pip install "pytest==${PYTEST_VERSION}"
      - name: Install coverage on the coverage interpreter
        if: matrix.python-version == '3.13'
        run: |
          set -Eeuo pipefail
          python -m pip install "coverage==${COVERAGE_VERSION}"
      - name: Run tests
        if: matrix.python-version != '3.13'
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python -m pytest
      # The floor is a ratchet, not a target: it sits below the measured figure so a
      # change that quietly drops a script back to untested fails here rather than
      # being noticed months later. Raise it in pyproject.toml when coverage rises.
      - name: Run tests with coverage and enforce the floor
        if: matrix.python-version == '3.13'
        run: |
          set -Eeuo pipefail
          set +e
          PYTHONPATH=src python -m coverage run -m pytest
          test_status=$?
          set -e
          # The summary is written before the floor is enforced, so a failing run
          # still shows which file fell.
          python -m coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report
          exit "$test_status"

  catalogue:
    name: check catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Every plugin is inside its listing ceiling
        # The runtime drops the descriptions of a plugin's least-used skills once the
        # listing overflows its budget, and says nothing: they stay invocable by name
        # and stop being chosen on their own. Re-cutting the plugins fixed that once;
        # this is what stops it growing back.
        run: |
          set -Eeuo pipefail
          python scripts/check_listing_budget.py .
      - name: The README still describes what is in the repository
        # A catalogue nobody checks is a catalogue that drifts. This one has, twice,
        # both times after the plugins were re-cut.
        run: |
          set -Eeuo pipefail
          python scripts/check_readme.py .
      - name: The CI documentation still lists the jobs CI runs
        # `docs/ci.md` is where a red check name turns into something actionable, so a
        # job with no row is a failure someone has to reverse-engineer from YAML. The
        # README drifted twice before it was gated; this is the same gate for the file
        # that documents the gates.
        run: |
          set -Eeuo pipefail
          python scripts/check_ci_docs.py .
      - name: Each workflow's aggregate names every job in it
        # `ci` and `security` are what branch protection requires, and they work by
        # listing every other job in `needs:`. A job missing from that list fails
        # without failing the required check, so the pull request merges green. This
        # also catches a pinned version that means two different things in two files.
        run: |
          set -Eeuo pipefail
          python scripts/check_workflows.py .
      - name: Every shell block and shipped script parses
        # The commands inside a fenced block are the part an agent follows most
        # literally, and they were the one part of a skill nothing checked: the
        # validator masks fences before scanning for dangling pointers, so nothing
        # else ever looked inside them. `bash -n` parses without executing, so this
        # runs no command and needs none of the binaries they name.
        run: |
          set -Eeuo pipefail
          python scripts/check_shell.py .
      - name: The hook registration points at a script that exists
        # `.claude/settings.json` is read by the runtime and by nothing else here, so
        # a typo in the path, or a stale one left after the script moved, disables the
        # hook with no error anywhere. The first symptom would be an unvalidated skill
        # reaching CI weeks later.
        run: |
          set -Eeuo pipefail
          python scripts/check_settings.py .

  spelling:
    name: lint spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-spelling-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - run: |
          set -Eeuo pipefail
          python -m pip install "codespell==${CODESPELL_VERSION}"
      - name: Check spelling
        # This ran weekly with only_warn set, which is the shape of check this
        # repository rejects everywhere else: nobody had to clear it, so nobody read
        # it. The false positives are listed in pyproject.toml with the reason each is
        # one, which is what lets the gate sit at zero and mean something.
        run: |
          set -Eeuo pipefail
          codespell

  lint-markdown:
    name: lint markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

  lint-yaml:
    name: lint yaml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: pip-lint-yaml-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - run: |
          set -Eeuo pipefail
          python -m pip install "yamllint==${YAMLLINT_VERSION}"
      - run: |
          set -Eeuo pipefail
          yamllint --strict --format github .

  lint-actions:
    name: lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        # actionlint also runs shellcheck over every inline `run:` block, which is
        # where all of this repository's shell actually lives.
        #
        # Downloaded at a pinned version and checked against a recorded digest rather
        # than piped from a script on a moving branch. `image-hardening` calls
        # `curl | bash` "an unreviewed commit author in your build"; a repository that
        # publishes that advice should not run CI that way.
        run: |
          set -Eeuo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" actionlint
          ./actionlint -color

  links:
    name: check links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check in-repository links
        # `--offline` only resolves local paths. External links flake, and a gate
        # that flakes is a gate people learn to ignore; the network check runs
        # weekly in scheduled.yml instead.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --offline --no-progress './**/*.md'
          fail: true
          # Already the default at this pin, and set explicitly because it is the guard
          # against the glob matching nothing: without it lychee reports zero links,
          # zero broken, and exits 0, and the check passes having read no file.
          failIfEmpty: true

  package:
    name: package
    needs:
      - validate-skills
      - validate-plugin
      - test
      - catalogue
      - spelling
      - lint-markdown
      - lint-yaml
      - lint-actions
      - links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'
      - name: Build a .skill archive for every skill
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/package_skills.py
      - name: Every archive holds a loadable skill
        # Building without error only proves the zip was written. What the upload route
        # needs is a SKILL.md at the archive root whose `name` matches the archive, and
        # a broken layout would ship silently: the build is green and the install is
        # what fails, for someone else, later.
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python - <<'EOF'
          import pathlib
          import zipfile

          from skillcheck.frontmatter import parse

          archives = sorted(pathlib.Path("dist").glob("*.skill"))
          if not archives:
              raise SystemExit("no archives in dist/")
          for archive in archives:
              stem = archive.stem
              with zipfile.ZipFile(archive) as bundle:
                  bad = bundle.testzip()
                  if bad is not None:
                      raise SystemExit(f"{archive}: corrupt member {bad}")
                  member = f"{stem}/SKILL.md"
                  if member not in bundle.namelist():
                      raise SystemExit(f"{archive}: no {member} in the archive")
                  values = parse(bundle.read(member).decode("utf-8")).values
              if values.get("name") != stem:
                  raise SystemExit(f"{archive}: declares name {values.get('name')!r}")
          print(f"{len(archives)} archive(s) verified")
          EOF
      - name: Flatten every skill into a file that stands alone
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src python scripts/export_portable.py .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: skills
          path: dist/*.skill
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: portable-skills
          path: dist/portable
          if-no-files-found: error

  ci:
    # One of the two required status checks; `security` in security.yml is the
    # other. Requiring the individual jobs instead would break the moment the test
    # matrix changes, because a matrix job's check name carries its parameters.
    name: ci
    if: always()
    needs:
      - validate-skills
      - validate-plugin
      - test
      - catalogue
      - spelling
      - lint-markdown
      - lint-yaml
      - lint-actions
      - links
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Verify every required CI job passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -Eeuo pipefail
          python3 scripts/check_job_results.py \
            validate-skills validate-plugin test catalogue spelling \
            lint-markdown lint-yaml lint-actions links package
