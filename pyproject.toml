[project]
name = "skillcheck"
version = "0.1.0"
description = "Validation for the Claude Code skills in this repository"
requires-python = ">=3.10"
# Intentionally empty, and enforced by the CI matrix: the validator has to run on a
# bare interpreter, because that is what a fresh runner gives you.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillcheck"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["src/skillcheck", "scripts"]
# The generator is the one script that needs a third-party package; it is run by hand
# when the parser changes and is not part of the suite.
omit = ["tests/fixtures/generate_block_scalars.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured at 98% when the floor was set; see `make coverage`.
fail_under = 95

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# "S" is flake8-bandit: the security rules CI relies on in the python job.
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.isort]
# The test modules import their shared helpers as `tests.conftest`.
known-first-party = ["skillcheck", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests assert; that is the whole point of them.
"tests/*" = ["S101"]

[tool.codespell]
skip = "./.git,./node_modules,./dist,*.lock"
quiet-level = 3
# Each of these is a false positive, and the gate is only worth having if it stays at
# zero. "trough" is the shape of a demand curve, not a typo for "through"; "applyable"
# and "unparseable" are spellings in tool output and prose this repository quotes
# verbatim; "stings" is the verb; "caf" is the first half of a latin-1 "cafe" in an
# encoding test; "aplha" is a deliberate misspelling in the test that proves a
# misspelled `expected` is caught. "lod" is level of detail, which is what the gamedev
# skills are talking about every time they use it.
ignore-words-list = "trough,applyable,unparseable,stings,caf,aplha,lod"
