<svg width="1280" height="200" viewBox="0 0 1280 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The ten plugins: coding, operations, delivery, security, gamedev, manager, personal, career, design and family">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#cbd5e1" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="fadeMask">
      <rect width="1280" height="200" fill="url(#fade)" />
    </mask>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <rect width="1280" height="200" fill="#f8fafc" />
  <g mask="url(#fadeMask)">
    <rect width="1280" height="200" fill="url(#grid)" />
  </g>
  <rect x="0" y="0" width="1280" height="5" fill="url(#accent)" />

  <rect x="48.0" y="78" width="105.0" height="44" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="100.5" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">coding</text>
  <rect x="164.9" y="78" width="153.0" height="44" rx="22" fill="#ffffff" stroke="#0ea5e9" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="241.4" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">operations</text>
  <rect x="329.8" y="78" width="129.0" height="44" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="394.2" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">delivery</text>
  <rect x="470.6" y="78" width="129.0" height="44" rx="22" fill="#ffffff" stroke="#0ea5e9" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="535.1" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">security</text>
  <rect x="611.5" y="78" width="117.0" height="44" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="670.0" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">gamedev</text>
  <rect x="740.4" y="78" width="117.0" height="44" rx="22" fill="#ffffff" stroke="#0ea5e9" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="798.9" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">manager</text>
  <rect x="869.2" y="78" width="129.0" height="44" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="933.8" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">personal</text>
  <rect x="1010.1" y="78" width="105.0" height="44" rx="22" fill="#ffffff" stroke="#0ea5e9" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="1062.6" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">career</text>
  <rect x="1127.0" y="78" width="105.0" height="44" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.55" stroke-width="1.5" />
  <text x="1179.5" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#334155">design</text>
</svg>
