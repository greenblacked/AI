<svg width="1280" height="200" viewBox="0 0 1280 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The twelve plugins: coding, family, gamedev, operations, delivery, security, manager, personal, career, design, llm and data">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#cbd5e1" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="fadeMask">
      <rect width="1280" height="200" fill="url(#fade)" />
    </mask>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <rect width="1280" height="200" fill="#f8fafc" />
  <g mask="url(#fadeMask)">
    <rect width="1280" height="200" fill="url(#grid)" />
  </g>
  <rect x="0" y="0" width="1280" height="5" fill="url(#accent)" />

