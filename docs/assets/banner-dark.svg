<svg width="1280" height="200" viewBox="0 0 1280 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The fourteen plugins: coding, family, gamedev, operations, delivery, security, manager, personal, career, design, llm, data, techdocs and assurance">
