<svg width="1280" height="200" viewBox="0 0 1280 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The eight plugins: coding, operations, delivery, security, gamedev, manager, personal and career">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#30363d" />
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="fadeMask">
      <rect width="1280" height="200" fill="url(#fade)" />
    </mask>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="1280" height="200" fill="#0d1117" />
  <g mask="url(#fadeMask)">
    <rect width="1280" height="200" fill="url(#grid)" />
  </g>
  <rect x="0" y="0" width="1280" height="5" fill="url(#accent)" />

  <rect x="64.0" y="78" width="112.0" height="44" rx="22" fill="#161b22" stroke="#7c3aed" stroke-opacity="0.7" stroke-width="1.5" />
  <text x="120.0" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#c9d1d9">coding</text>
  <rect x="192.0" y="78" width="160.0" height="44" rx="22" fill="#161b22" stroke="#0ea5e9" stroke-opacity="0.7" stroke-width="1.5" />
  <text x="272.0" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#c9d1d9">operations</text>
  <rect x="368.0" y="78" width="136.0" height="44" rx="22" fill="#161b22" stroke="#7c3aed" stroke-opacity="0.7" stroke-width="1.5" />
  <text x="436.0" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#c9d1d9">delivery</text>
  <rect x="520.0" y="78" width="136.0" height="44" rx="22" fill="#161b22" stroke="#0ea5e9" stroke-opacity="0.7" stroke-width="1.5" />
  <text x="588.0" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#c9d1d9">security</text>
  <rect x="672.0" y="78" width="124.0" height="44" rx="22" fill="#161b22" stroke="#7c3aed" stroke-opacity="0.7" stroke-width="1.5" />
  <text x="734.0" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#c9d1d9">gamedev</text>
  <rect x="812.0" y="78" width="124.0" height="44" rx="22" fill="#161b22" stroke="#0ea5e9" stroke-opacity="0.7" stroke-width="1.5" />
  <text x="874.0" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#c9d1d9">manager</text>
  <rect x="952.0" y="78" width="136.0" height="44" rx="22" fill="#161b22" stroke="#7c3aed" stroke-opacity="0.7" stroke-width="1.5" />
  <text x="1020.0" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#c9d1d9">personal</text>
  <rect x="1104.0" y="78" width="112.0" height="44" rx="22" fill="#161b22" stroke="#0ea5e9" stroke-opacity="0.7" stroke-width="1.5" />
  <text x="1160.0" y="100" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#c9d1d9">career</text>
</svg>
