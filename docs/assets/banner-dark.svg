      <stop offset="0" stop-color="#a78bfa" />
      <stop offset="1" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="#0d1117" />
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.6" />

