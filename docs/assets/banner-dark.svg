<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent skills banner, listing the eight plugins: coding, operations, delivery, security, gamedev, manager, personal, career">
  <defs>
